<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>サンダーバード 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0008 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ffd24a;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(30,20,8,0.7);border:2px solid var(--c,#ffd24a);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,210,74,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0008 0%,#5a1010 70%,#aa1010 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffd24a);margin-bottom:6px}p{font-size:0.8rem;color:#fec;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🦅 サンダーバード — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「火炎ブレス」を維持、飛行能力も維持</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 嘴突き</h2><p>金の嘴で突く近距離単発。</p></div>
<div class="card" style="--c:#88aaff;--g:rgba(136,170,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 雷光弾</h2><p>口から青い雷弾を中距離発射。</p></div>
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 風切り爪</h2><p>急降下しながら爪で斬る。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#5a1010';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a1010';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ff5500';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawPhoenix(c,x,y){c.fillStyle='#ddaa22';c.beginPath();c.ellipse(x-15,y-30,18,12,-0.3,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(x+15,y-30,18,12,0.3,0,Math.PI*2);c.fill();c.fillStyle='#ffd24a';c.fillRect(x-12,y-25,24,18);c.beginPath();c.arc(x+10,y-30,7,0,Math.PI*2);c.fill();c.fillStyle='#000';c.beginPath();c.arc(x+12,y-32,1.5,0,Math.PI*2);c.fill();c.fillStyle='#ff5500';c.beginPath();c.moveTo(x+15,y-30);c.lineTo(x+22,y-28);c.lineTo(x+15,y-26);c.closePath();c.fill();c.strokeStyle='#ffd24a';c.lineWidth=2;c.beginPath();c.moveTo(x+5,y-7);c.lineTo(x+15,y+5);c.stroke();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawPhoenix(c,w*0.3,h*0.55);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+15+tt*15;
    c.fillStyle='#ff5500';c.beginPath();c.moveTo(x+15,h*0.55-30);c.lineTo(x+30,h*0.55-25);c.lineTo(x+15,h*0.55-25);c.closePath();c.fill();
  }else{c.fillStyle=`rgba(255,210,74,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1400);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawPhoenix(c,w*0.25,h*0.5);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+20+tt*(tg.x-w*0.25-30);const y=h*0.52+tt*(tg.y-16-h*0.52);
    c.fillStyle='rgba(136,170,255,0.85)';c.beginPath();c.arc(x,y,8,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,0.95)';c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill();
    // 雷の枝
    c.strokeStyle='rgba(136,170,255,0.6)';c.lineWidth=1.5;for(let k=0;k<3;k++){const ang=k*Math.PI*0.7;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ang)*8,y+Math.sin(ang)*8);c.stroke();}
  }else{c.fillStyle=`rgba(136,170,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  if(t<0.6){const tt=t/0.6;const x=w*0.25+tt*(tg.x-w*0.25-20);const y=h*0.35+tt*(tg.y-50-h*0.35);
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.25+tk*(tg.x-w*0.25-20);const yk=h*0.35+tk*(tg.y-50-h*0.35);
      c.fillStyle=`rgba(255,255,255,${0.4-k*0.08})`;c.beginPath();c.arc(xk,yk,10-k,0,Math.PI*2);c.fill();}
    drawPhoenix(c,x,y);
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.6)/0.4})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    for(let i=0;i<3;i++){c.strokeStyle=`rgba(255,255,255,${1-(t-0.6)/0.4})`;c.lineWidth=2;c.beginPath();c.moveTo(tg.x-12+i*4,tg.y-22);c.lineTo(tg.x-8+i*4,tg.y-10);c.stroke();}}
},1500);
</script></body></html>
