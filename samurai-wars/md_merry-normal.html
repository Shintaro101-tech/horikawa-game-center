<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>呪い人形メリー 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🎀 呪い人形メリー — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（小人形3体召喚）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 針投げ</h2><p>1本の針を遠距離単発で投げる。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 刀振り</h2><p>市松人形の小刀を振り下ろす近距離攻撃。</p></div>
<div class="card" style="--c:#ff66cc;--g:rgba(255,102,204,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 呪詛詠唱</h2><p>地上に呪いの魔法陣を出現させる中範囲AOE。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#2a1828';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#aa1010';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawMerry(c,x,y){c.fillStyle='#aa1010';c.beginPath();c.moveTo(x-6,y-14);c.lineTo(x-14,y);c.lineTo(x+14,y);c.lineTo(x+6,y-14);c.closePath();c.fill();for(let r=0;r<2;r++)for(let cc=0;cc<3;cc++){if((r+cc)%2===0){c.fillStyle='#0a0a0a';c.fillRect(x-10+cc*7,y-10+r*5,5,3);}}c.fillStyle='#aa1010';c.fillRect(x-7,y-26,14,12);c.fillStyle='#ffd24a';c.fillRect(x-7,y-20,14,2);c.fillStyle='#f8e0c8';c.beginPath();c.arc(x,y-32,6,0,Math.PI*2);c.fill();c.fillStyle='#0a0a0a';c.beginPath();c.arc(x,y-34,6,Math.PI,0);c.fill();c.fillStyle='#ffd24a';c.beginPath();c.arc(x-3,y-38,1.5,0,Math.PI*2);c.fill();c.fillStyle='#000';c.fillRect(x-2,y-32,1,1);c.fillRect(x+1,y-32,1,1);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMerry(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+12+tt*(tg.x-w*0.2-25);
    c.save();c.translate(x,h*0.55);c.rotate(tt*Math.PI*3);
    c.strokeStyle='#aaa';c.lineWidth=2;c.beginPath();c.moveTo(-10,0);c.lineTo(10,0);c.stroke();
    c.fillStyle='#dde8f0';c.beginPath();c.moveTo(10,-3);c.lineTo(16,0);c.lineTo(10,3);c.closePath();c.fill();
    c.restore();
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.06);const xk=w*0.2+12+tk*(tg.x-w*0.2-25);
      c.strokeStyle=`rgba(221,232,240,${0.4-k*0.08})`;c.lineWidth=1.5;c.beginPath();c.moveTo(xk-8,h*0.55);c.lineTo(xk+10,h*0.55);c.stroke();}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();}
},1700);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMerry(c,w*0.3,h*0.7);
  if(t<0.5){const tt=t/0.5;const ang=-Math.PI/2+tt*Math.PI*0.7;
    for(let k=4;k>=0;k--){const a2=-Math.PI/2+(tt-k*0.04)*Math.PI*0.7;
      const x=w*0.3+15+Math.cos(a2)*40,y=h*0.65+Math.sin(a2)*40;
      c.strokeStyle=`rgba(255,210,74,${0.5-k*0.1})`;c.lineWidth=5;c.lineCap='round';
      c.beginPath();c.moveTo(w*0.3+15,h*0.65);c.lineTo(x,y);c.stroke();}c.lineCap='butt';
    // 刀
    const x=w*0.3+15+Math.cos(ang)*40,y=h*0.65+Math.sin(ang)*40;
    c.save();c.translate(x,y);c.rotate(ang+Math.PI/2);
    c.fillStyle='#dde8f0';c.fillRect(-2,-15,4,30);c.fillStyle='#aa1010';c.fillRect(-3,12,6,3);c.restore();
  }else{const tt=(t-0.5)/0.5;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();
    // 血飛沫
    for(let i=0;i<5;i++){const ang=Math.random()*Math.PI*2;
      c.fillStyle='#aa1010';c.beginPath();c.arc(tg.x+Math.cos(ang)*12,tg.y-16+Math.sin(ang)*12,2,0,Math.PI*2);c.fill();}}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMerry(c,w*0.25,h*0.7);
  // 魔法陣（ピンク）が地上に出現
  if(t<0.4){const tt=t/0.4;
    c.strokeStyle=`rgba(255,102,204,${tt})`;c.lineWidth=2;
    c.beginPath();c.ellipse(tg.x,tg.y,40*tt,15*tt,0,0,Math.PI*2);c.stroke();
    // 5角星
    c.save();c.translate(tg.x,tg.y);c.rotate(t*Math.PI*2);
    c.strokeStyle=`rgba(255,102,204,${tt*0.8})`;c.lineWidth=1.5;
    c.beginPath();
    for(let k=0;k<5;k++){const a=k*Math.PI*2/5-Math.PI/2;
      if(k===0) c.moveTo(Math.cos(a)*30*tt,Math.sin(a)*8*tt);
      else c.lineTo(Math.cos(a)*30*tt,Math.sin(a)*8*tt);}
    c.closePath();c.stroke();c.restore();
  }else{const tt=(t-0.4)/0.6;
    c.fillStyle=`rgba(255,102,204,${(1-tt)*0.7})`;
    c.beginPath();c.ellipse(tg.x,tg.y,45,16,0,0,Math.PI*2);c.fill();
    // 光柱
    c.fillStyle=`rgba(255,102,204,${(1-tt)*0.6})`;c.fillRect(tg.x-15,h*0.2,30,h*0.5);
    c.fillStyle=`rgba(255,255,255,${1-tt})`;c.fillRect(tg.x-5,h*0.2,10,h*0.5);
    // 花びら
    for(let i=0;i<8;i++){const ang=i*Math.PI/4+tt*Math.PI*4;
      c.fillStyle='#ff66cc';c.beginPath();c.arc(tg.x+Math.cos(ang)*tt*30,tg.y-16+Math.sin(ang)*tt*20,3,0,Math.PI*2);c.fill();}}
},2000);
</script></body></html>
