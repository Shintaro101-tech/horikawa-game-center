<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ブレットマン 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🚄 ブレットマン — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（音速ダッシュ画面横断）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 高速パンチ</h2><p>音速の鋭いパンチ。近距離単発。</p></div>
<div class="card" style="--c:#aaccff;--g:rgba(170,204,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 飛び蹴り</h2><p>跳び上がって蹴り。中距離突進＋単発。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 弾丸投擲</h2><p>弾丸を1発、遠距離で投げつける。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#fff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawBullet(c,x,y){c.fillStyle='#dde8f0';c.beginPath();c.moveTo(x-10,y-32);c.lineTo(x+15,y-30);c.lineTo(x+14,y-8);c.lineTo(x-10,y-10);c.closePath();c.fill();c.fillStyle='#0a3a8a';c.fillRect(x-10,y-22,25,3);c.fillStyle='#fff';c.beginPath();c.moveTo(x-6,y-36);c.lineTo(x+12,y-38);c.lineTo(x+14,y-32);c.lineTo(x-5,y-30);c.closePath();c.fill();c.fillStyle='#0a0a3a';c.fillRect(x-1,y-36,9,4);c.fillStyle='#00f0ff';c.fillRect(x+4,y-35,3,1);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBullet(c,w*0.25,h*0.7);
  if(t<0.3){const tt=t/0.3;const x=w*0.25+15+tt*(tg.x-w*0.25-25);
    // パンチ（拳）
    c.fillStyle='#dde8f0';c.fillRect(x-8,h*0.6-6,18,14);
    // 残像
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.03);const xk=w*0.25+15+tk*(tg.x-w*0.25-25);
      c.fillStyle=`rgba(221,232,240,${0.5-k*0.1})`;c.fillRect(xk-8,h*0.6-5,18,12);}
  }else{const tt=(t-0.3)/0.7;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,20+tt*10,0,Math.PI*2);c.fill();
    // 衝撃線
    for(let k=0;k<8;k++){const ang=k*Math.PI/4;c.strokeStyle=`rgba(170,204,255,${1-tt})`;c.lineWidth=2;
      c.beginPath();c.moveTo(tg.x,tg.y-16);c.lineTo(tg.x+Math.cos(ang)*(20+tt*20),tg.y-16+Math.sin(ang)*(20+tt*20));c.stroke();}}
},1300);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBullet(c,w*0.25,h*0.7);
  if(t<0.5){const tt=t/0.5;const x=w*0.25+15+tt*(tg.x-w*0.25-25);const y=h*0.7-Math.sin(tt*Math.PI)*40;
    // 残像
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.04);const xk=w*0.25+15+tk*(tg.x-w*0.25-25);const yk=h*0.7-Math.sin(tk*Math.PI)*40;
      c.fillStyle=`rgba(170,204,255,${0.5-k*0.1})`;c.fillRect(xk-8,yk-30,16,30);}
    // 蹴り（足を前に伸ばす）
    c.fillStyle='#dde8f0';c.fillRect(x-6,y-30,12,30);
    c.fillRect(x+6,y-12,18,8);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x+6,y-12,18,8);
  }else{const tt=(t-0.5)/0.5;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18+tt*10,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBullet(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+15+tt*(tg.x-w*0.2-25);
    // 弾丸（流線型）
    c.fillStyle='#ffd24a';c.beginPath();c.moveTo(x-6,h*0.6);c.lineTo(x+8,h*0.6-3);c.lineTo(x+8,h*0.6+3);c.closePath();c.fill();
    // 残像
    for(let k=1;k<6;k++){const tk=Math.max(0,tt-k*0.04);const xk=w*0.2+15+tk*(tg.x-w*0.2-25);
      c.fillStyle=`rgba(255,210,74,${0.5-k*0.08})`;c.fillRect(xk-6,h*0.6-2,8,4);}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1600);
</script></body></html>
