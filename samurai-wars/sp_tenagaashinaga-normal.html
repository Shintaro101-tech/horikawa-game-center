<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>手長足長 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0a30 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#aa44ff;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#aa44ff);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(170,68,255,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0a30 0%,#3a2050 70%,#3a2060 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#aa44ff);margin-bottom:6px}p{font-size:0.8rem;color:#dcf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>👤 手長足長 — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「妖怪渦巻」を維持</div>
<div class="grid">
<div class="card" style="--c:#aa44ff;--g:rgba(170,68,255,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 長い手刀</h2><p>遠い距離まで届く手で斬る中距離単発。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 長い足蹴り</h2><p>長足で蹴る中距離単発。</p></div>
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 影投擲</h2><p>影の塊を中距離に投擲。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#3a2050';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a2060';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#aa44ff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawTwin(c,x,y){c.fillStyle='#3a1a4a';c.fillRect(x-12,y-50,8,50);c.fillRect(x+4,y-50,8,50);c.beginPath();c.arc(x-8,y-56,6,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+8,y-56,6,0,Math.PI*2);c.fill();c.fillStyle='#ff3344';c.beginPath();c.arc(x-9,y-56,1.5,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+7,y-56,1.5,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTwin(c,w*0.25,h*0.7);
  const reach = t<0.5 ? t*2 : 1-(t-0.5)*2;
  const hx = w*0.25-12 + reach*(tg.x-w*0.25);
  c.strokeStyle='#3a1a4a';c.lineWidth=4;c.beginPath();c.moveTo(w*0.25-8,h*0.7-50);c.lineTo(hx,h*0.65);c.stroke();
  c.fillStyle='#aa44ff';c.beginPath();c.arc(hx,h*0.65,6,0,Math.PI*2);c.fill();
  // 手刀
  c.fillStyle='#fff';c.fillRect(hx-2,h*0.65-2,12,3);
  if(t>0.4){c.fillStyle=`rgba(170,68,255,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1600);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTwin(c,w*0.25,h*0.7);
  const reach = t<0.5 ? t*2 : 1-(t-0.5)*2;
  const lx = w*0.25+8 + reach*(tg.x-w*0.25-15);
  c.strokeStyle='#3a1a4a';c.lineWidth=5;c.beginPath();c.moveTo(w*0.25+8,h*0.7);c.lineTo(lx,h*0.68);c.stroke();
  c.fillStyle='#1a1a1a';c.fillRect(lx-3,h*0.68-1,12,3);
  if(t>0.4){c.fillStyle=`rgba(255,210,74,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTwin(c,w*0.25,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.25-5+tt*(tg.x-w*0.25);const y=h*0.55-Math.sin(tt*Math.PI)*20;
    // 影球
    c.fillStyle='rgba(40,20,60,0.85)';c.beginPath();c.arc(x,y,10,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(0,0,0,0.8)';c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.25-5+tk*(tg.x-w*0.25);const yk=h*0.55-Math.sin(tk*Math.PI)*20;
      c.fillStyle=`rgba(40,20,60,${0.5-k*0.1})`;c.beginPath();c.arc(xk,yk,9-k,0,Math.PI*2);c.fill();}
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
