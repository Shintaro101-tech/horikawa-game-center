<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メガロドン デザイン候補プレビュー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#001f4d 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);background-attachment:fixed;min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.5rem;font-weight:900;color:#ff3344;text-shadow:0 0 30px rgba(255,51,68,0.6);margin-bottom:6px}
h3.section{text-align:center;font-size:1.1rem;color:#18FFFF;letter-spacing:4px;margin:28px 0 14px;text-shadow:0 0 12px rgba(24,255,255,0.5)}
.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1000px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ffd24a);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,210,74,0.25))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0820 0%,#1a2858 70%,#1a3868 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}
canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffd24a);margin-bottom:6px}
p{font-size:0.8rem;color:#cdf;line-height:1.4}
footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🦈 メガロドン デザイン & 攻撃 候補</h1>
<div class="sub">MEGALODON CANDIDATES</div>

<h3 class="section">— キャラデザイン3案 —</h3>
<div class="grid">
<div class="card" style="--c:#5a6a7a;--g:rgba(90,106,122,0.5)"><div class="canv-wrap"><canvas id="ch-a" width="220" height="240"></canvas></div><h2>案A. 深海の灰色ザメ（現行）</h2><p>灰色+白腹、リアル古代鮫。</p></div>
<div class="card" style="--c:#0a0a0a;--g:rgba(80,80,80,0.5)"><div class="canv-wrap"><canvas id="ch-b" width="220" height="240"></canvas></div><h2>案B. 古代の漆黒ザメ</h2><p>黒+赤目+多数の歯。古代魔ザメ。</p></div>
<div class="card" style="--c:#aaeeff;--g:rgba(170,238,255,0.5)"><div class="canv-wrap"><canvas id="ch-c" width="220" height="240"></canvas></div><h2>案C. 凍結の白ザメ</h2><p>白+氷の体表+青い目。氷の魔王ザメ。</p></div>
</div>

<h3 class="section">— 攻撃方法3案 —</h3>
<div class="grid">
<div class="card" style="--c:#88ccff;--g:rgba(136,204,255,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案① 水柱（現行）</h2><p>高圧水鉄砲で貫通。</p></div>
<div class="card" style="--c:#ff5544;--g:rgba(255,85,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案② 海中突進＋大咬みつき</h2><p>海から飛び出して突進+巨大な咬みつき。</p></div>
<div class="card" style="--c:#aaeeff;--g:rgba(170,238,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案③ 大渦巻きAOE</h2><p>周囲を渦巻きで巻き込む円形AOE。</p></div>
</div>
<footer>© HORIKAWA FAMILY · PREVIEW BUILD</footer>

<script>
function aura(c,x,y,col,r=80){const g=c.createRadialGradient(x,y,4,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function drawShark(c,p){
  const cx=110,cy=160;
  if(p.aura)aura(c,cx,cy,p.aura,120);
  c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(cx,cy+60,50,8,0,0,Math.PI*2);c.fill();
  // 体（流線型）
  c.fillStyle=p.bodyShade||'#3a4a5a';
  c.beginPath();c.moveTo(cx-50,cy+10);c.quadraticCurveTo(cx-30,cy-30,cx+20,cy-20);c.quadraticCurveTo(cx+70,cy-15,cx+80,cy);c.quadraticCurveTo(cx+70,cy+20,cx+20,cy+30);c.quadraticCurveTo(cx-30,cy+25,cx-50,cy+10);c.closePath();c.fill();
  c.fillStyle=p.body;c.beginPath();c.moveTo(cx-50,cy+10);c.quadraticCurveTo(cx-30,cy-30,cx+20,cy-20);c.quadraticCurveTo(cx+70,cy-15,cx+80,cy);c.lineTo(cx+80,cy-3);c.quadraticCurveTo(cx+70,cy-18,cx+20,cy-23);c.quadraticCurveTo(cx-30,cy-33,cx-50,cy+10);c.closePath();c.fill();
  // 腹
  c.fillStyle=p.belly||'#dde8f0';
  c.beginPath();c.moveTo(cx-40,cy+15);c.quadraticCurveTo(cx-10,cy+30,cx+40,cy+25);c.quadraticCurveTo(cx+60,cy+18,cx+60,cy+10);c.quadraticCurveTo(cx+20,cy+22,cx-40,cy+15);c.closePath();c.fill();
  // 氷の体表（C案）
  if(p.ice){for(let i=0;i<10;i++){const ix=cx-40+i*12,iy=cy-15+Math.sin(i)*8;
    c.fillStyle='rgba(220,240,255,0.6)';c.beginPath();c.arc(ix,iy,4,0,Math.PI*2);c.fill();}}
  // 背びれ
  c.fillStyle=p.body;c.beginPath();c.moveTo(cx+5,cy-22);c.lineTo(cx+15,cy-55);c.lineTo(cx+30,cy-20);c.closePath();c.fill();
  // 尾びれ
  c.fillStyle=p.body;c.beginPath();c.moveTo(cx-50,cy+10);c.lineTo(cx-90,cy-25);c.lineTo(cx-65,cy-5);c.lineTo(cx-75,cy+30);c.lineTo(cx-50,cy+10);c.closePath();c.fill();
  // 胸びれ
  c.fillStyle=p.body;c.beginPath();c.moveTo(cx-10,cy+20);c.lineTo(cx-25,cy+45);c.lineTo(cx+10,cy+30);c.closePath();c.fill();
  // 目
  c.fillStyle=p.eyeBg||'#fff';c.beginPath();c.arc(cx+55,cy-5,4,0,Math.PI*2);c.fill();
  c.fillStyle=p.eye||'#0a0a0a';c.beginPath();c.arc(cx+55,cy-5,2.5,0,Math.PI*2);c.fill();
  // 口
  c.fillStyle='#0a0a0a';c.beginPath();c.moveTo(cx+72,cy+2);c.quadraticCurveTo(cx+50,cy+15,cx+25,cy+18);c.quadraticCurveTo(cx+40,cy+25,cx+72,cy+15);c.closePath();c.fill();
  // 歯（多列・B案で強調）
  c.fillStyle='#fff';
  const teethCount=p.bigTeeth?7:5;
  for(let i=0;i<teethCount;i++){const tx=cx+30+i*7,ts=p.bigTeeth?6:4;
    c.beginPath();c.moveTo(tx,cy+10);c.lineTo(tx+2,cy+10+ts);c.lineTo(tx+4,cy+10);c.closePath();c.fill();
    c.beginPath();c.moveTo(tx,cy+18);c.lineTo(tx+2,cy+18-ts);c.lineTo(tx+4,cy+18);c.closePath();c.fill();}
  // エラ
  c.strokeStyle=p.bodyShade||'#1a2a3a';c.lineWidth=1.5;
  for(let i=0;i<3;i++){c.beginPath();c.arc(cx+15-i*6,cy+5,8,Math.PI*0.3,Math.PI*0.7);c.stroke();}
}
drawShark(document.getElementById('ch-a').getContext('2d'),{aura:'rgba(90,106,122,0.4)',body:'#5a6a7a',bodyShade:'#3a4a5a',belly:'#dde8f0',eye:'#0a0a0a'});
drawShark(document.getElementById('ch-b').getContext('2d'),{aura:'rgba(170,16,16,0.5)',body:'#1a1a1a',bodyShade:'#0a0a0a',belly:'#3a1010',eye:'#ff0000',bigTeeth:true});
drawShark(document.getElementById('ch-c').getContext('2d'),{aura:'rgba(170,238,255,0.5)',body:'#dde8ff',bodyShade:'#aaccee',belly:'#fff',eye:'#00f0ff',ice:true});

function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a1828');sky.addColorStop(1,'#1a3548');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a2a3a';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#88ccff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}

// ① 水柱
startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  if(t<0.7){const tt=t/0.7;const x=40+tt*(tg.x-50);
    c.fillStyle=`rgba(136,204,255,${0.8-tt*0.3})`;c.beginPath();c.ellipse(x,h*0.6,40-tt*5,8,0,0,Math.PI*2);c.fill();
    // 飛沫
    for(let i=0;i<5;i++){c.fillStyle='rgba(200,230,255,0.7)';c.beginPath();c.arc(x-20+Math.random()*30,h*0.6+(Math.random()-0.5)*15,3,0,Math.PI*2);c.fill();}}
  else{c.fillStyle=`rgba(255,255,200,${1-(t-0.7)*3})`;c.beginPath();c.arc(tg.x,tg.y-16,25,0,Math.PI*2);c.fill();}
},2000);

// ② 海中突進+咬みつき
startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  if(t<0.5){const tt=t/0.5;const x=40+tt*(tg.x-60);const y=h*0.6+Math.sin(tt*Math.PI)*-50;
    // 水しぶき
    for(let k=0;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=40+tk*(tg.x-60);
      c.fillStyle=`rgba(136,204,255,${0.5-k*0.08})`;c.beginPath();c.arc(xk,h*0.6,12-k,0,Math.PI*2);c.fill();}
    // 鮫本体（小）
    c.fillStyle='#5a6a7a';c.beginPath();c.ellipse(x,y,18,8,0,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.beginPath();c.moveTo(x+15,y+3);c.lineTo(x+18,y+5);c.lineTo(x+10,y+5);c.closePath();c.fill();}
  else{const tt=(t-0.5)/0.5;
    c.fillStyle=`rgba(255,85,68,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,30+tt*15,0,Math.PI*2);c.fill();
    // 巨大な口（噛みつき）
    c.fillStyle=`rgba(255,0,0,${0.7-tt*0.5})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();
    // 歯
    for(let i=0;i<10;i++){const ang=i*Math.PI*0.2;c.fillStyle=`rgba(255,255,255,${1-tt})`;
      c.beginPath();c.moveTo(tg.x+Math.cos(ang)*18,tg.y-16+Math.sin(ang)*18);c.lineTo(tg.x+Math.cos(ang)*30,tg.y-16+Math.sin(ang)*30);c.lineTo(tg.x+Math.cos(ang+0.1)*18,tg.y-16+Math.sin(ang+0.1)*18);c.closePath();c.fill();}}
},2400);

// ③ 大渦巻き
startAnim('at-c',(c,t,w,h)=>{const cx=w*0.55,cy=h*0.6;
  for(let i=0;i<3;i++)drawEnemy(c,cx-50+i*40,h*0.7);
  // 渦
  for(let k=0;k<15;k++){const ang=k*0.8+t*Math.PI*4;const rr=10+k*5;
    c.strokeStyle=`rgba(170,238,255,${0.6-k*0.03})`;c.lineWidth=4-k*0.15;
    c.beginPath();c.arc(cx,cy,rr,ang,ang+1.5);c.stroke();}
  // 中央の渦
  c.fillStyle='rgba(0,100,180,0.6)';c.beginPath();c.arc(cx,cy,15,0,Math.PI*2);c.fill();
  // 水しぶき
  for(let i=0;i<6;i++){const ang=i*Math.PI/3+t*Math.PI*2;const rr=70;
    c.fillStyle='rgba(200,230,255,0.7)';c.beginPath();c.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr*0.6,4,0,Math.PI*2);c.fill();}
},2400);
</script></body></html>
