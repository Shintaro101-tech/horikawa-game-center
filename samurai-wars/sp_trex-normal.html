<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ティラノサウルス 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#3a1808 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ffaa44;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(30,20,10,0.7);border:2px solid var(--c,#ffaa44);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,170,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a2010 0%,#264a18 70%,#3a4a18 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffaa44);margin-bottom:6px}p{font-size:0.8rem;color:#fdd;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🦖 ティラノサウルス — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は別途設定可能。まず通常攻撃を選んでください</div>
<div class="grid">
<div class="card" style="--c:#aa6644;--g:rgba(170,102,68,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 噛みつき</h2><p>巨大な顎で近距離単発。最高威力。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 尾びれ叩き</h2><p>強靭な尾で前方を薙ぐ近接AOE。</p></div>
<div class="card" style="--c:#ff5544;--g:rgba(255,85,68,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 大咆哮</h2><p>口から衝撃波を前方発射。中距離。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a2010');sky.addColorStop(1,'#264a18');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a4a18';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#88aa44';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawTRex(c,x,y){c.fillStyle='#aa6644';c.fillRect(x-18,y-26,32,26);c.beginPath();c.arc(x+16,y-30,8,0,Math.PI*2);c.fill();c.fillStyle='#000';c.beginPath();c.arc(x+22,y-32,1.5,0,Math.PI*2);c.fill();c.fillStyle='#0a0a0a';c.beginPath();c.arc(x+22,y-26,6,0.3,Math.PI-0.3);c.fill();c.fillStyle='#fff';for(let i=0;i<3;i++){c.beginPath();c.moveTo(x+20+i*2,y-23);c.lineTo(x+21+i*2,y-18);c.lineTo(x+22+i*2,y-23);c.closePath();c.fill();}c.fillStyle='#aa6644';c.beginPath();c.moveTo(x-18,y-16);c.lineTo(x-30,y-10);c.lineTo(x-18,y-8);c.closePath();c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTRex(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+18+tt*(tg.x-w*0.3-30);
    c.fillStyle='#0a0a0a';c.beginPath();c.arc(x,h*0.66,14,0.1,Math.PI-0.1);c.fill();
    c.fillStyle='#fff';for(let i=0;i<5;i++){c.beginPath();c.moveTo(x-10+i*5,h*0.66);c.lineTo(x-8+i*5,h*0.66+8);c.lineTo(x-6+i*5,h*0.66);c.closePath();c.fill();}
  }else{const tt=(t-0.4)/0.6;c.fillStyle=`rgba(255,255,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    for(let i=0;i<6;i++){const ang=i*Math.PI/3;c.strokeStyle=`rgba(255,255,255,${1-tt})`;c.lineWidth=2;
      c.beginPath();c.moveTo(tg.x+Math.cos(ang)*8,tg.y-16+Math.sin(ang)*8);c.lineTo(tg.x+Math.cos(ang)*16,tg.y-16+Math.sin(ang)*16);c.stroke();}}
},1500);

startAnim('at-b',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.65,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawTRex(c,w*0.25,h*0.7);
  const cx=w*0.25-30,cy=h*0.6;
  const ang=Math.sin(t*Math.PI*2)*0.7;
  for(let k=4;k>=0;k--){const a2=Math.sin((t-k*0.04)*Math.PI*2)*0.7;
    c.save();c.translate(cx,cy);c.rotate(a2);c.fillStyle=`rgba(170,102,68,${0.5-k*0.1})`;c.fillRect(0,-5,50,10);c.restore();}
  c.save();c.translate(cx,cy);c.rotate(ang);c.fillStyle='#aa6644';c.fillRect(0,-6,55,12);c.restore();
},1600);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTRex(c,w*0.25,h*0.7);
  const x=w*0.25+24+t*(tg.x-w*0.25-30);
  for(let k=0;k<5;k++){const xk=Math.max(w*0.25+24,x-k*16);
    c.strokeStyle=`rgba(255,85,68,${0.6-k*0.1})`;c.lineWidth=4;
    c.beginPath();c.arc(xk,h*0.62,10+k*3,Math.PI*1.7,Math.PI*0.3);c.stroke();}
  c.fillStyle='rgba(255,255,200,0.5)';c.beginPath();c.arc(w*0.25+30,h*0.62,12+Math.sin(t*10)*3,0,Math.PI*2);c.fill();
  if(t>0.7){const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,85,68,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22+tt*8,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
