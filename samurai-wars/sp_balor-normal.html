<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>バロール 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a3018 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#88aa44;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,30,15,0.7);border:2px solid var(--c,#88aa44);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(136,170,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a2010 0%,#264a18 70%,#3a4a18 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#88aa44);margin-bottom:6px}p{font-size:0.8rem;color:#dfd;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>👁 バロール — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「邪眼凝視」を維持</div>
<div class="grid">
<div class="card" style="--c:#aaa;--g:rgba(170,170,170,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 拳殴り</h2><p>苔むした巨大な拳で殴る近接単発。</p></div>
<div class="card" style="--c:#ff3344;--g:rgba(255,51,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 短い邪眼光</h2><p>邪眼から短距離の赤い光線を1発。</p></div>
<div class="card" style="--c:#aa6644;--g:rgba(170,102,68,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 岩投擲</h2><p>体から千切った岩を遠距離に投げる。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#264a18';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a4a18';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#5a6a3a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawBalor(c,x,y){c.fillStyle='#5a6a5a';c.fillRect(x-14,y-34,28,34);c.fillStyle='#3a6a3a';c.fillRect(x-12,y-30,4,4);c.fillRect(x+8,y-25,3,3);c.fillStyle='#5a6a5a';c.beginPath();c.arc(x,y-46,11,0,Math.PI*2);c.fill();c.fillStyle='#ff3344';c.beginPath();c.arc(x,y-46,5,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y-46,2,0,Math.PI*2);c.fill();c.fillStyle='#3a6a3a';c.fillRect(x-8,y-58,3,5);c.fillRect(x+5,y-58,3,5);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBalor(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+14+tt*22;
    c.fillStyle='#5a6a5a';c.fillRect(x-10,h*0.62-10,20,20);c.fillStyle='#3a6a3a';c.fillRect(x-8,h*0.62-8,3,3);c.fillRect(x+4,h*0.62-6,3,3);
  }else{c.fillStyle=`rgba(255,255,200,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBalor(c,w*0.25,h*0.7);
  if(t<0.3){const tt=t/0.3;c.fillStyle=`rgba(255,51,68,${tt})`;c.beginPath();c.arc(w*0.25,h*0.7-46,6+tt*3,0,Math.PI*2);c.fill();}
  else{const tt=(t-0.3)/0.7;
    c.fillStyle=`rgba(255,51,68,${0.7*(1-tt*0.5)})`;c.fillRect(w*0.25+8,h*0.7-50,tg.x-w*0.25-15,8);
    c.fillStyle=`rgba(255,255,255,${1-tt*0.5})`;c.fillRect(w*0.25+8,h*0.7-48,tg.x-w*0.25-15,4);
    c.fillStyle=`rgba(255,51,68,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1400);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBalor(c,w*0.25,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+15+tt*(tg.x-w*0.25-30);const y=h*0.55-Math.sin(tt*Math.PI)*30;
    c.fillStyle='#5a4030';c.beginPath();c.arc(x+2,y+2,12,0,Math.PI*2);c.fill();
    c.fillStyle='#888';c.beginPath();c.arc(x,y,12,0,Math.PI*2);c.fill();
    c.fillStyle='#3a6a3a';c.beginPath();c.arc(x-4,y-3,4,0,Math.PI*2);c.fill();
  }else{c.fillStyle=`rgba(170,102,68,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
