<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>孫悟空 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0a40 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ffd24a;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(30,20,8,0.7);border:2px solid var(--c,#ffd24a);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,210,74,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0a40 0%,#503090 70%,#3a2060 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffd24a);margin-bottom:6px}p{font-size:0.8rem;color:#fec;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🐒 孫悟空 — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「七十二変化（分身ラッシュ）」を維持</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 如意棒振り</h2><p>金の如意棒で振り下ろす近接単発。</p></div>
<div class="card" style="--c:#88dd44;--g:rgba(136,221,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 如意棒回転</h2><p>頭上で如意棒を回転、周囲AOE。</p></div>
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 觔斗雲ダイブ</h2><p>雲に乗って中距離突進。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#503090';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a2060';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ffd24a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawGokuu(c,x,y){c.fillStyle='#cc6600';c.fillRect(x-10,y-30,20,30);c.fillStyle='#aa4400';c.fillRect(x-12,y-25,24,3);c.fillStyle='#cc6600';c.beginPath();c.arc(x,y-38,7,0,Math.PI*2);c.fill();c.fillStyle='#1a1a1a';c.fillRect(x-7,y-42,14,3);c.fillStyle='#ffd24a';c.beginPath();c.arc(x,y-44,2,0,Math.PI*2);c.fill();c.fillStyle='#cc6600';c.fillRect(x-4,y-44,2,4);c.fillRect(x+2,y-44,2,4);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawGokuu(c,w*0.3,h*0.7);
  if(t<0.5){const tt=t/0.5;const ang=-Math.PI/3+tt*Math.PI*0.7;
    c.save();c.translate(w*0.3+12,h*0.65);c.rotate(ang);
    c.fillStyle='#5a3010';c.fillRect(0,-2,50,4);c.fillStyle='#ffd24a';c.fillRect(45,-3,8,6);c.restore();
    for(let k=1;k<4;k++){const a2=-Math.PI/3+(tt-k*0.04)*Math.PI*0.7;
      c.strokeStyle=`rgba(255,210,74,${0.5-k*0.1})`;c.lineWidth=4;c.beginPath();c.moveTo(w*0.3+12,h*0.65);c.lineTo(w*0.3+12+Math.cos(a2)*48,h*0.65+Math.sin(a2)*48);c.stroke();}
  }else{c.fillStyle=`rgba(255,210,74,${1-(t-0.5)/0.5})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1400);

startAnim('at-b',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.62,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawGokuu(c,w*0.3,h*0.7);
  const cx=w*0.3+12,cy=h*0.5;const ang=t*Math.PI*4;
  for(let k=0;k<5;k++){const a=ang+k*Math.PI*0.4;
    c.save();c.translate(cx,cy);c.rotate(a);
    c.fillStyle=`rgba(255,210,74,${0.7-k*0.13})`;c.fillRect(-25,-2,50,4);c.restore();}
  c.fillStyle='#ffd24a';c.beginPath();c.arc(cx,cy,4,0,Math.PI*2);c.fill();
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  if(t<0.6){const tt=t/0.6;const x=w*0.3+tt*(tg.x-w*0.3-25);const y=h*0.45+Math.sin(tt*Math.PI*2)*8;
    // 雲
    for(let k=0;k<4;k++){c.fillStyle=`rgba(255,255,255,${0.7-k*0.15})`;c.beginPath();c.arc(x-k*8,y+18,12,0,Math.PI*2);c.fill();}
    drawGokuu(c,x,y);
    // 残像
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.04);const xk=w*0.3+tk*(tg.x-w*0.3-25);c.fillStyle=`rgba(255,255,255,${0.3-k*0.07})`;c.beginPath();c.arc(xk,h*0.45,16-k*2,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.6)/0.4;c.fillStyle=`rgba(255,255,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();}
},1600);
</script></body></html>
