<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ゴーレム 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a3018 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#88aa44;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,30,15,0.7);border:2px solid var(--c,#88aa44);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(136,170,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a2010 0%,#264a18 70%,#3a4a18 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#88aa44);margin-bottom:6px}p{font-size:0.8rem;color:#dfd;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🪨 ゴーレム — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「自爆突進」を維持</div>
<div class="grid">
<div class="card" style="--c:#888;--g:rgba(136,136,136,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 拳殴り</h2><p>巨大な石の拳で殴る近接単発。</p></div>
<div class="card" style="--c:#aa6644;--g:rgba(170,102,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 岩投げ</h2><p>体から千切った岩を中距離投擲。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 地面叩き</h2><p>両手で地面を叩く狭範囲AOE。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#264a18';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a4a18';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#5a6a3a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawGolem(c,x,y){c.fillStyle='#5a6a5a';c.fillRect(x-15,y-32,30,32);c.fillStyle='#3a6a3a';c.fillRect(x-13,y-30,4,5);c.fillRect(x+5,y-26,4,3);c.fillRect(x-8,y-15,5,4);c.fillStyle='#5a6a5a';c.fillRect(x-10,y-48,20,16);c.fillStyle='#3a4a3a';c.fillRect(x-8,y-46,16,2);c.fillStyle='#88ff44';c.fillRect(x-6,y-42,4,4);c.fillRect(x+2,y-42,4,4);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawGolem(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+15+tt*(tg.x-w*0.3-25);
    c.fillStyle='#5a6a5a';c.fillRect(x-12,h*0.62-12,24,24);c.strokeStyle='#3a4a3a';c.lineWidth=1;c.strokeRect(x-12,h*0.62-12,24,24);
    c.fillStyle='#3a6a3a';c.fillRect(x-10,h*0.62-10,4,4);c.fillRect(x+4,h*0.62-8,4,4);
  }else{c.fillStyle=`rgba(255,255,200,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(255,210,74,${1-(t-0.4)/0.6})`;c.lineWidth=3;c.beginPath();c.arc(tg.x,tg.y-16,30,0,Math.PI*2);c.stroke();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawGolem(c,w*0.3,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.3+15+tt*(tg.x-w*0.3-30);const y=h*0.55-Math.sin(tt*Math.PI)*30;
    c.fillStyle='#5a4030';c.beginPath();c.arc(x+2,y+2,12,0,Math.PI*2);c.fill();
    c.fillStyle='#888';c.beginPath();c.arc(x,y,12,0,Math.PI*2);c.fill();
    c.fillStyle='#aaa';c.beginPath();c.arc(x-3,y-3,5,0,Math.PI*2);c.fill();
  }else{c.fillStyle=`rgba(170,102,68,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,24,0,Math.PI*2);c.fill();
    for(let i=0;i<8;i++){c.fillStyle='#888';c.fillRect(tg.x+Math.cos(i)*15+(Math.random()-0.5)*8,tg.y-16+Math.sin(i)*10,3,3);}}
},1600);

startAnim('at-c',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.6,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawGolem(c,w*0.3,h*0.7);
  if(t<0.3){const tt=t/0.3;
    c.fillStyle='#5a6a5a';c.fillRect(w*0.3-25,h*0.55-tt*5,50,15);
  }else{const tt=(t-0.3)/0.7;
    c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.ellipse(w*0.3+10,h*0.7,50+tt*30,8,0,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(255,210,74,${1-tt})`;c.lineWidth=3;
    for(let k=0;k<3;k++){c.beginPath();c.ellipse(w*0.3+10,h*0.7,40+tt*40+k*15,8,0,0,Math.PI*2);c.stroke();}
    // 亀裂
    c.strokeStyle=`rgba(80,60,30,${1-tt})`;c.lineWidth=2;
    for(let i=0;i<5;i++){const a=i*Math.PI*0.4;c.beginPath();c.moveTo(w*0.3+10,h*0.7);c.lineTo(w*0.3+10+Math.cos(a)*tt*40,h*0.7+Math.sin(a)*tt*8);c.stroke();}}
},1700);
</script></body></html>
