<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>フロストジャイアント 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#0a1830 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#aaeeff;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(15,20,30,0.7);border:2px solid var(--c,#aaeeff);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(170,238,255,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a1830 0%,#3a5a8a 70%,#aacce0 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#aaeeff);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>❄ フロストジャイアント — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「絶対零度・吹雪」を維持</div>
<div class="grid">
<div class="card" style="--c:#cceeff;--g:rgba(204,238,255,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 氷柱投擲</h2><p>結晶の氷柱を1本、中距離投擲。</p></div>
<div class="card" style="--c:#aaccff;--g:rgba(170,204,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 氷の拳</h2><p>結晶化した拳で殴る近接単発。</p></div>
<div class="card" style="--c:#88ccff;--g:rgba(136,204,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 冷気波</h2><p>前方に冷気の波を放つ中範囲。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#3a5a8a';c.fillRect(0,0,w,h*0.7);c.fillStyle='#aacce0';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#446a8a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawFrost(c,x,y){c.fillStyle='#aaeeff';c.fillRect(x-14,y-40,28,40);c.fillStyle='#88ccdd';c.fillRect(x-16,y-36,4,12);c.fillRect(x+12,y-36,4,12);c.beginPath();c.arc(x,y-50,10,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.moveTo(x-8,y-62);c.lineTo(x-10,y-72);c.lineTo(x-3,y-66);c.closePath();c.fill();c.beginPath();c.moveTo(x,y-62);c.lineTo(x-2,y-76);c.lineTo(x+3,y-66);c.closePath();c.fill();c.beginPath();c.moveTo(x+8,y-62);c.lineTo(x+10,y-72);c.lineTo(x+3,y-66);c.closePath();c.fill();c.fillStyle='#88ccff';c.beginPath();c.arc(x-3,y-50,1.5,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+3,y-50,1.5,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawFrost(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+14+tt*(tg.x-w*0.2-30);const y=h*0.55-Math.sin(tt*Math.PI)*20;
    c.save();c.translate(x,y);c.rotate(tt*Math.PI*4);
    c.fillStyle='#88ccff';c.fillRect(-2,-12,4,24);c.beginPath();c.moveTo(-2,-12);c.lineTo(0,-18);c.lineTo(2,-12);c.closePath();c.fill();c.beginPath();c.moveTo(-2,12);c.lineTo(0,18);c.lineTo(2,12);c.closePath();c.fill();c.restore();
  }else{c.fillStyle=`rgba(170,204,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();
    for(let i=0;i<6;i++){const a=i*Math.PI/3;c.strokeStyle=`rgba(255,255,255,${1-(t-0.7)/0.3})`;c.lineWidth=1.5;c.beginPath();c.moveTo(tg.x,tg.y-16);c.lineTo(tg.x+Math.cos(a)*16,tg.y-16+Math.sin(a)*16);c.stroke();}}
},1600);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawFrost(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+14+tt*20;
    c.fillStyle='#aaeeff';c.fillRect(x-10,h*0.6-10,20,20);c.fillStyle='#cceeff';c.fillRect(x-8,h*0.6-8,4,4);c.fillRect(x+4,h*0.6-6,4,4);c.fillRect(x-5,h*0.6+2,3,3);
  }else{c.fillStyle=`rgba(170,238,255,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    for(let i=0;i<5;i++){c.fillStyle='#fff';c.fillRect(tg.x+(Math.random()-0.5)*22,tg.y-16+(Math.random()-0.5)*20,3,3);}}
},1500);

startAnim('at-c',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.62,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawFrost(c,w*0.25,h*0.7);
  for(let k=0;k<10;k++){const tk=Math.max(0,t-k*0.04);const xk=w*0.25+14+tk*(w*0.65);
    c.fillStyle=`rgba(170,238,255,${0.5-k*0.04})`;c.beginPath();c.ellipse(xk,h*0.6+Math.sin(t*8+k)*4,12+k,8,0,0,Math.PI*2);c.fill();}
  // 雪片
  for(let i=0;i<20;i++){const rx=w*0.25+Math.random()*w*0.6;const ry=h*0.5+Math.random()*h*0.2;c.fillStyle='#fff';c.fillRect(rx,ry,2,2);}
},1800);
</script></body></html>
