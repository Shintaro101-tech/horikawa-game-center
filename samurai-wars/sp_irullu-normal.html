<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>イルルヤンカシュ 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0a40 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#3a8a5a;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(15,30,20,0.7);border:2px solid var(--c,#3a8a5a);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(58,138,90,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0a40 0%,#503090 70%,#3a2060 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#3a8a5a);margin-bottom:6px}p{font-size:0.8rem;color:#dfd;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🐉 イルルヤンカシュ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「火炎ブレス」を維持、飛行能力も維持</div>
<div class="grid">
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 龍爪</h2><p>金の爪で斬る近接単発。</p></div>
<div class="card" style="--c:#ff5500;--g:rgba(255,85,0,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 短い火炎弾</h2><p>赤い火炎弾を1発、遠距離発射。</p></div>
<div class="card" style="--c:#3a8a5a;--g:rgba(58,138,90,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 龍尾叩き</h2><p>長い尾で前方を払う近接AOE。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#503090';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a2060';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ffd24a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawDragon(c,x,y){c.strokeStyle='#3a8a5a';c.lineWidth=18;c.lineCap='round';c.beginPath();c.moveTo(x-35,y-8);c.bezierCurveTo(x-20,y-30,x-5,y-35,x+10,y-32);c.stroke();c.fillStyle='#3a8a5a';c.beginPath();c.arc(x+12,y-32,12,0,Math.PI*2);c.fill();c.fillStyle='#ffd24a';c.beginPath();c.moveTo(x+5,y-44);c.lineTo(x+8,y-52);c.lineTo(x+12,y-44);c.closePath();c.fill();c.beginPath();c.moveTo(x+15,y-44);c.lineTo(x+18,y-52);c.lineTo(x+22,y-44);c.closePath();c.fill();c.fillStyle='#ffd24a';c.beginPath();c.arc(x+16,y-32,1.5,0,Math.PI*2);c.fill();c.lineCap='butt';}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawDragon(c,w*0.25,h*0.7);
  if(t<0.4){const tt=t/0.4;const ang=-Math.PI/4+tt*Math.PI*0.5;
    c.save();c.translate(w*0.25+18,h*0.65);c.rotate(ang);
    c.fillStyle='#ffd24a';c.beginPath();c.moveTo(0,-2);c.lineTo(35,-5);c.lineTo(0,2);c.closePath();c.fill();c.beginPath();c.moveTo(35,-5);c.lineTo(45,0);c.lineTo(35,5);c.closePath();c.fill();c.restore();
  }else{c.fillStyle=`rgba(255,210,74,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();
    for(let i=0;i<3;i++){c.strokeStyle=`rgba(255,255,255,${1-(t-0.4)/0.6})`;c.lineWidth=2;c.beginPath();c.moveTo(tg.x-10+i*3,tg.y-22);c.lineTo(tg.x-5+i*3,tg.y-10);c.stroke();}}
},1400);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawDragon(c,w*0.25,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+25+tt*(tg.x-w*0.25-35);
    c.fillStyle='#ff5500';c.beginPath();c.arc(x,h*0.6,9,0,Math.PI*2);c.fill();
    c.fillStyle='#ffd24a';c.beginPath();c.arc(x-2,h*0.6,5,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(x-3,h*0.6,2,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.25+25+tk*(tg.x-w*0.25-35);
      c.fillStyle=`rgba(255,85,0,${0.4-k*0.08})`;c.beginPath();c.arc(xk,h*0.6,8-k,0,Math.PI*2);c.fill();}
  }else{c.fillStyle=`rgba(255,85,0,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1600);

startAnim('at-c',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.65,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawDragon(c,w*0.25,h*0.7);
  const cx=w*0.25-35,cy=h*0.65;const ang=Math.sin(t*Math.PI*2)*0.7;
  for(let k=4;k>=0;k--){const a2=Math.sin((t-k*0.04)*Math.PI*2)*0.7;
    c.save();c.translate(cx,cy);c.rotate(a2);c.fillStyle=`rgba(58,138,90,${0.6-k*0.1})`;c.fillRect(0,-7,90,14);c.restore();}
  c.save();c.translate(cx,cy);c.rotate(ang);c.fillStyle='#3a8a5a';c.fillRect(0,-7,90,14);c.restore();
},1700);
</script></body></html>
