<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>サンドワーム 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#3a1808 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ffaa44;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(30,20,10,0.7);border:2px solid var(--c,#ffaa44);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,170,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#3a1808 0%,#aa6020 70%,#aa6a30 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffaa44);margin-bottom:6px}p{font-size:0.8rem;color:#fdc;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🪱 サンドワーム — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「巨体ジャンプ叩きつけ」を維持</div>
<div class="grid">
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 噛みつき</h2><p>無数の歯で噛む近接単発。</p></div>
<div class="card" style="--c:#aa6644;--g:rgba(170,102,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 砂吐き</h2><p>口から砂塊を中距離発射。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 体当たり</h2><p>胴体を伸ばして突進する近距離攻撃。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#aa6020';c.fillRect(0,0,w,h*0.7);c.fillStyle='#aa6a30';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#5a2a10';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawWorm(c,x,y){c.fillStyle='#a07040';for(let i=0;i<5;i++){c.beginPath();c.arc(x-i*8,y-15-Math.sin(i)*5,12,0,Math.PI*2);c.fill();}c.beginPath();c.arc(x+5,y-15,16,0,Math.PI*2);c.fill();c.fillStyle='#0a0a0a';c.beginPath();c.arc(x+10,y-15,10,0.2,Math.PI-0.2);c.fill();c.fillStyle='#fff';for(let i=0;i<6;i++){c.beginPath();c.moveTo(x+4+i*2.5,y-15);c.lineTo(x+5+i*2.5,y-9);c.lineTo(x+6+i*2.5,y-15);c.closePath();c.fill();}}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawWorm(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+15+tt*(tg.x-w*0.3-30);
    c.fillStyle='#0a0a0a';c.beginPath();c.arc(x,h*0.66,14,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';for(let i=0;i<8;i++){const a=i*Math.PI/4;c.beginPath();c.moveTo(x+Math.cos(a)*8,h*0.66+Math.sin(a)*8);c.lineTo(x+Math.cos(a)*14,h*0.66+Math.sin(a)*14);c.lineTo(x+Math.cos(a+0.2)*8,h*0.66+Math.sin(a+0.2)*8);c.closePath();c.fill();}
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawWorm(c,w*0.3,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.3+22+tt*(tg.x-w*0.3-35);
    c.fillStyle='#aa6644';c.beginPath();c.arc(x,h*0.6,10,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.3+22+tk*(tg.x-w*0.3-35);
      c.fillStyle=`rgba(170,102,68,${0.5-k*0.1})`;c.beginPath();c.arc(xk,h*0.6,9-k,0,Math.PI*2);c.fill();}
    for(let i=0;i<6;i++){c.fillStyle='#5a3010';c.beginPath();c.arc(x+(Math.random()-0.5)*16,h*0.6+(Math.random()-0.5)*12,2,0,Math.PI*2);c.fill();}
  }else{c.fillStyle=`rgba(170,102,68,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1700);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  const x=w*0.3+t*(tg.x-w*0.3-20);drawWorm(c,x,h*0.7);
  for(let k=1;k<5;k++){const tk=Math.max(0,t-k*0.06);const xk=w*0.3+tk*(tg.x-w*0.3-20);
    c.fillStyle=`rgba(255,210,74,${0.4-k*0.08})`;c.beginPath();c.arc(xk,h*0.65,18-k*2,0,Math.PI*2);c.fill();}
  if(t>0.6){c.fillStyle=`rgba(255,255,200,${1-(t-0.6)/0.4})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1500);
</script></body></html>
