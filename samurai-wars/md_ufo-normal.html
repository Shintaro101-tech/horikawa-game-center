<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UFO円盤王ゼノス 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#000020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🛸 UFO円盤王ゼノス — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（5方向同時ビーム）はそのまま。飛行能力も維持</div>
<div class="grid">
<div class="card" style="--c:#aaffaa;--g:rgba(170,255,170,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 単発ビーム</h2><p>緑のビーム1発を遠距離発射。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 誘拐光線</h2><p>1体の敵を光線で持ち上げ、地に叩きつける。</p></div>
<div class="card" style="--c:#aa44ff;--g:rgba(170,68,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. プラズマ弾</h2><p>紫プラズマの球を1発、中距離発射。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#000020');sky.addColorStop(1,'#1a0a40');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#0a0a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#88dd66';c.fillRect(0,h*0.7,w,1);for(let i=0;i<15;i++){c.fillStyle='#fff';c.fillRect((i*23)%w,(i*13)%(h*0.5),1,1);}}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawUFO(c,x,y){c.fillStyle='#666';c.beginPath();c.ellipse(x,y+3,25,7,0,0,Math.PI*2);c.fill();c.fillStyle='#aaa';c.beginPath();c.ellipse(x,y,25,6,0,0,Math.PI*2);c.fill();c.fillStyle='#cceeff';c.beginPath();c.arc(x,y-3,10,Math.PI,0);c.fill();c.fillStyle='#ddd';c.beginPath();c.ellipse(x,y-5,5,7,0,0,Math.PI*2);c.fill();c.fillStyle='#000';c.beginPath();c.ellipse(x-2,y-7,1.5,2.5,0,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(x+2,y-7,1.5,2.5,0,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawUFO(c,w*0.25,h*0.3);
  if(t<0.3){const tt=t/0.3;c.fillStyle=`rgba(170,255,170,${tt*0.8})`;c.beginPath();c.arc(w*0.25,h*0.3+5,8*tt,0,Math.PI*2);c.fill();}
  else{const tt=(t-0.3)/0.7;
    c.strokeStyle=`rgba(170,255,170,${1-tt*0.4})`;c.lineWidth=6;c.beginPath();c.moveTo(w*0.25,h*0.3+5);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.strokeStyle=`rgba(255,255,255,${1-tt*0.4})`;c.lineWidth=2;c.beginPath();c.moveTo(w*0.25,h*0.3+5);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.fillStyle=`rgba(170,255,170,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18+tt*8,0,Math.PI*2);c.fill();}
},1600);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};const enemyY = h*0.7 - (t<0.6?Math.sin(t*Math.PI/0.6)*80:0);
  c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(tg.x,h*0.7,10,3,0,0,Math.PI*2);c.fill();
  c.fillStyle='#5a1a1a';c.fillRect(tg.x-6,enemyY-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(tg.x,enemyY-26,5,0,Math.PI*2);c.fill();
  drawUFO(c,tg.x,h*0.22);
  // 黄色の誘拐光線
  c.fillStyle=`rgba(255,210,74,${0.4+Math.sin(t*Math.PI*4)*0.15})`;
  c.beginPath();c.moveTo(tg.x-12,h*0.22+5);c.lineTo(tg.x-30,h*0.7);c.lineTo(tg.x+30,h*0.7);c.lineTo(tg.x+12,h*0.22+5);c.closePath();c.fill();
  c.fillStyle=`rgba(255,255,200,0.5)`;
  c.beginPath();c.moveTo(tg.x-5,h*0.22+5);c.lineTo(tg.x-15,h*0.7);c.lineTo(tg.x+15,h*0.7);c.lineTo(tg.x+5,h*0.22+5);c.closePath();c.fill();
  if(t>0.7){const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,h*0.7-16,16+tt*10,0,Math.PI*2);c.fill();}
},2200);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawUFO(c,w*0.25,h*0.3);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+tt*(tg.x-w*0.25-10);const y=h*0.3+5+tt*(tg.y-16-h*0.35);
    c.fillStyle=`rgba(170,68,255,0.85)`;c.beginPath();c.arc(x,y,9-tt*2,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(220,180,255,0.95)`;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();
    // 軌跡
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.25+tk*(tg.x-w*0.25-10);const yk=h*0.3+5+tk*(tg.y-16-h*0.35);
      c.fillStyle=`rgba(170,68,255,${0.5-k*0.1})`;c.beginPath();c.arc(xk,yk,6-k,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(170,68,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22+tt*10,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,10,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
