<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>スモッグマン 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>☠ 公害怪獣スモッグマン — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（酸性雨）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#3a3a3a;--g:rgba(80,80,80,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 黒煙吐き</h2><p>黒い煙の塊を1発、遠距離に吐き出す。</p></div>
<div class="card" style="--c:#aa44ff;--g:rgba(170,68,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 毒霧拳</h2><p>紫の毒霧をまとった拳で近距離殴打。</p></div>
<div class="card" style="--c:#88dd44;--g:rgba(136,221,68,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 汚染粒子3連射</h2><p>緑の毒粒子を3連続で射出。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#1a1a08');sky.addColorStop(1,'#3a3018');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#2a2818';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#88aa44';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawSmog(c,x,y){c.fillStyle='#3a1a4a';for(let i=0;i<6;i++){const ang=i*Math.PI/3;c.beginPath();c.arc(x+Math.cos(ang)*10,y-18+Math.sin(ang)*10,15,0,Math.PI*2);c.fill();}c.fillStyle='#7a3a8a';for(let i=0;i<6;i++){const ang=i*Math.PI/3;c.beginPath();c.arc(x+Math.cos(ang)*10,y-18+Math.sin(ang)*10,12,0,Math.PI*2);c.fill();}c.fillStyle='#ff3344';c.beginPath();c.arc(x-5,y-18,2.5,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+5,y-18,2.5,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSmog(c,w*0.2,h*0.65);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+20+tt*(tg.x-w*0.2-30);
    // 黒い煙の塊
    c.fillStyle=`rgba(60,60,60,0.85)`;c.beginPath();c.arc(x,h*0.6,10,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(40,40,40,0.95)`;c.beginPath();c.arc(x-3,h*0.6,7,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.04);const xk=w*0.2+20+tk*(tg.x-w*0.2-30);
      c.fillStyle=`rgba(60,60,60,${0.4-k*0.07})`;c.beginPath();c.arc(xk,h*0.6,8-k,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.7)/0.3;
    c.fillStyle=`rgba(60,60,60,${(1-tt)*0.8})`;c.beginPath();c.arc(tg.x,tg.y-16,22+tt*8,0,Math.PI*2);c.fill();
    for(let i=0;i<6;i++){const ang=Math.random()*Math.PI*2;c.fillStyle='rgba(40,40,40,0.5)';
      c.beginPath();c.arc(tg.x+Math.cos(ang)*tt*22,tg.y-16+Math.sin(ang)*tt*16,4,0,Math.PI*2);c.fill();}}
},1700);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.5,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSmog(c,w*0.25,h*0.65);
  // 紫煙オーラがある拳
  if(t<0.5){const tt=t/0.5;const x=w*0.25+15+tt*(tg.x-w*0.25-25);
    // 拳
    c.fillStyle='#7a3a8a';c.beginPath();c.arc(x,h*0.62,10,0,Math.PI*2);c.fill();
    // 紫オーラ
    for(let k=0;k<8;k++){const ang=k*Math.PI/4+tt*Math.PI*2;
      c.fillStyle=`rgba(170,68,255,${0.5-tt*0.3})`;c.beginPath();c.arc(x+Math.cos(ang)*14,h*0.62+Math.sin(ang)*14,4,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.5)/0.5;c.fillStyle=`rgba(170,68,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,20+tt*10,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,10,0,Math.PI*2);c.fill();}
},1600);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSmog(c,w*0.2,h*0.65);
  const phase=t*3;const idx=Math.floor(phase);const sub=phase-idx;
  for(let k=0;k<=idx&&k<3;k++){const ph=t*3-k;const tt=Math.max(0,Math.min(1,ph));
    const x=w*0.2+20+tt*(tg.x-w*0.2-30);
    c.fillStyle='#88dd44';c.beginPath();c.arc(x,h*0.6+k*2-2,5,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(136,221,68,0.5)';c.beginPath();c.arc(x,h*0.6+k*2-2,9,0,Math.PI*2);c.fill();}
  if(sub<0.4){c.fillStyle=`rgba(136,221,68,${1-sub*2.5})`;c.beginPath();c.arc(tg.x,tg.y-16,15,0,Math.PI*2);c.fill();}
  c.fillStyle='#88dd44';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText('☣ '+(Math.min(idx+1,3))+'HIT',tg.x,h*0.95);
},1400);
</script></body></html>
