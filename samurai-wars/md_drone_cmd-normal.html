<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ドローン軍団長 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🚁 ドローン軍団長 — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（精密誘導3連ミサイル）はそのまま。飛行能力も維持</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. ハンドガン</h2><p>拳銃で素早く単発射撃。</p></div>
<div class="card" style="--c:#88aaff;--g:rgba(136,170,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 小型ドローン特攻</h2><p>1機の小型ドローンが敵に突進。</p></div>
<div class="card" style="--c:#ff5544;--g:rgba(255,85,68,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 小型爆弾</h2><p>小さな爆弾を中距離で投下。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#2a2828';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#fff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawCmd(c,x,y){c.fillStyle='#3a4a7a';c.fillRect(x-12,y-32,24,32);c.fillStyle='#ffd24a';c.fillRect(x-10,y-30,3,2);c.fillRect(x-10,y-26,3,2);c.fillStyle='#f0d4a8';c.beginPath();c.arc(x,y-38,5,0,Math.PI*2);c.fill();c.fillStyle='#5a6a8a';c.beginPath();c.arc(x,y-39,5,Math.PI,0);c.fill();c.fillStyle='#000';c.fillRect(x-3,y-38,2,1);c.fillRect(x+1,y-38,2,1);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawCmd(c,w*0.2,h*0.7);
  if(t<0.2){const tt=t/0.2;
    c.fillStyle='#aaa';c.fillRect(w*0.2+12,h*0.6-2,12,4);
    c.fillStyle='#ffd24a';c.beginPath();c.arc(w*0.2+26,h*0.6,4*tt,0,Math.PI*2);c.fill();}
  else if(t<0.7){const tt=(t-0.2)/0.5;const x=w*0.2+24+tt*(tg.x-w*0.2-40);
    c.fillStyle='#aaa';c.fillRect(w*0.2+12,h*0.6-2,12,4);
    c.fillStyle='#ffd24a';c.beginPath();c.arc(x,h*0.6,2.5,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.2+24+tk*(tg.x-w*0.2-40);
      c.fillStyle=`rgba(255,210,74,${0.5-k*0.1})`;c.beginPath();c.arc(xk,h*0.6,2,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawCmd(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+20+tt*(tg.x-w*0.2-30);const y=h*0.45-Math.sin(tt*Math.PI*2)*4;
    // 残像
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.2+20+tk*(tg.x-w*0.2-30);
      c.fillStyle=`rgba(136,170,255,${0.4-k*0.08})`;c.beginPath();c.arc(xk,y,4,0,Math.PI*2);c.fill();}
    // ドローン本体
    c.fillStyle='#1a1a1a';c.fillRect(x-7,y-3,14,6);
    c.strokeStyle='#444';c.lineWidth=1;c.beginPath();c.moveTo(x-10,y-6);c.lineTo(x-7,y-3);c.stroke();c.beginPath();c.moveTo(x+10,y-6);c.lineTo(x+7,y-3);c.stroke();
    c.fillStyle='#ff3344';c.beginPath();c.arc(x,y,2,0,Math.PI*2);c.fill();
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,150,50,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,10,0,Math.PI*2);c.fill();}
},1600);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawCmd(c,w*0.2,h*0.7);
  if(t<0.65){const tt=t/0.65;const x=w*0.2+12+tt*(tg.x-w*0.2-20);const y=h*0.45+tt*(h*0.7-h*0.45)-Math.sin(tt*Math.PI)*40;
    // 軌跡
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.06);const xk=w*0.2+12+tk*(tg.x-w*0.2-20);const yk=h*0.45+tk*(h*0.7-h*0.45)-Math.sin(tk*Math.PI)*40;
      c.fillStyle=`rgba(255,150,50,${0.4-k*0.08})`;c.beginPath();c.arc(xk,yk,4-k,0,Math.PI*2);c.fill();}
    // 爆弾
    c.fillStyle='#1a1a1a';c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();
    c.fillStyle='#ff5544';c.fillRect(x-1,y-8,2,3);
    c.fillStyle='#ffd24a';c.beginPath();c.arc(x,y-9,1.5,0,Math.PI*2);c.fill();
  }else{const tt=(t-0.65)/0.35;c.fillStyle=`rgba(255,150,50,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,30+tt*15,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,14,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
