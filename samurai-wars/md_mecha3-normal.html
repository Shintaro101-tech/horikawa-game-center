<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>メカ怪獣MK-III 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🤖 メカ怪獣 MK-III — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（12連ミサイル乱射）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. ロケットパンチ</h2><p>切り離した拳を遠距離に飛ばす。</p></div>
<div class="card" style="--c:#aa44ff;--g:rgba(170,68,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 胸ビーム</h2><p>胸のコアから紫色のビーム1発。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 単発ミサイル</h2><p>1発の小型ミサイルを中距離発射。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#3a1818');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1010';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ff3344';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawMecha(c,x,y){c.fillStyle='#1a1a1a';c.fillRect(x-15,y-40,30,40);c.fillStyle='#3a0a3a';c.fillRect(x-13,y-38,26,18);c.fillStyle='#aa44ff';c.beginPath();c.arc(x,y-28,5,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y-28,2,0,Math.PI*2);c.fill();c.fillStyle='#1a1a1a';c.fillRect(x-10,y-55,20,15);c.fillStyle='#aa44ff';c.fillRect(x-7,y-50,14,3);c.fillStyle='#1a1a1a';c.fillRect(x-22,y-32,7,12);c.fillRect(x+15,y-32,7,12);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMecha(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+22+tt*(tg.x-w*0.2-35);
    // ロケットパンチ
    c.fillStyle='#dde8f0';c.fillRect(x-10,h*0.6-8,20,16);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x-10,h*0.6-8,20,16);
    c.fillStyle='#aa1010';c.fillRect(x-8,h*0.6-6,4,4);c.fillRect(x-1,h*0.6-6,4,4);c.fillRect(x+6,h*0.6-6,4,4);
    // 噴射炎
    c.fillStyle='#ffd24a';c.beginPath();c.moveTo(x-10,h*0.6-4);c.lineTo(x-22,h*0.6);c.lineTo(x-10,h*0.6+4);c.closePath();c.fill();
    c.fillStyle='#ff8800';c.beginPath();c.moveTo(x-10,h*0.6-2);c.lineTo(x-18,h*0.6);c.lineTo(x-10,h*0.6+2);c.closePath();c.fill();
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,150,50,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,28+tt*8,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,14,0,Math.PI*2);c.fill();}
},1700);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMecha(c,w*0.25,h*0.7);
  if(t<0.3){const tt=t/0.3;c.fillStyle=`rgba(170,68,255,${tt})`;c.beginPath();c.arc(w*0.25,h*0.7-28,7+tt*3,0,Math.PI*2);c.fill();}
  else{const tt=(t-0.3)/0.7;
    // 紫ビーム
    c.fillStyle=`rgba(170,68,255,${0.6*(1-tt*0.4)})`;c.fillRect(w*0.25+8,h*0.7-32,tg.x-w*0.25-15,12);
    c.fillStyle=`rgba(220,180,255,${0.85*(1-tt*0.4)})`;c.fillRect(w*0.25+8,h*0.7-30,tg.x-w*0.25-15,8);
    c.fillStyle=`rgba(255,255,255,${1-tt*0.4})`;c.fillRect(w*0.25+8,h*0.7-28,tg.x-w*0.25-15,4);
    c.fillStyle=`rgba(170,68,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22+tt*8,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMecha(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+15+tt*(tg.x-w*0.2-25);const y=h*0.55-Math.sin(tt*Math.PI)*8;
    // ミサイル
    c.fillStyle='#aaa';c.fillRect(x-10,y-3,20,6);c.fillStyle='#ff5544';c.beginPath();c.moveTo(x+10,y-3);c.lineTo(x+16,y);c.lineTo(x+10,y+3);c.closePath();c.fill();
    // 噴射
    c.fillStyle='#ffd24a';c.fillRect(x-18,y-2,8,4);
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.2+15+tk*(tg.x-w*0.2-25);const yk=h*0.55-Math.sin(tk*Math.PI)*8;
      c.fillStyle=`rgba(255,210,74,${0.5-k*0.1})`;c.fillRect(xk-22,yk-1,8,3);}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,150,50,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22+tt*10,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,11,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
