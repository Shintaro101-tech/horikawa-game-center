<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>テケテケ 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>👻 テケテケ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（瞬間移動3連撃）はそのまま。瞬間移動能力も維持</div>
<div class="grid">
<div class="card" style="--c:#aaa;--g:rgba(170,170,170,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 爪斬り</h2><p>近距離で鋭い爪を振るう単発攻撃。</p></div>
<div class="card" style="--c:#ffaa44;--g:rgba(255,170,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 高速4連爪</h2><p>左右の爪で素早く4連続斬り。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 地這い突進</h2><p>地を這って中距離突進。短い貫通。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#080010');sky.addColorStop(1,'#2a0830');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a0a1a';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#aa1010';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawTeke(c,x,y){c.fillStyle='rgba(0,0,0,0.5)';c.beginPath();c.ellipse(x,y,18,3,0,0,Math.PI*2);c.fill();c.fillStyle='#aa1010';c.fillRect(x-10,y-6,20,3);c.fillStyle='#1a1a4a';c.fillRect(x-11,y-28,22,22);c.fillStyle='#fff';c.beginPath();c.moveTo(x-11,y-28);c.lineTo(x,y-18);c.lineTo(x+11,y-28);c.closePath();c.fill();c.fillStyle='#aa1010';c.beginPath();c.moveTo(x-2,y-20);c.lineTo(x,y-12);c.lineTo(x+2,y-20);c.closePath();c.fill();c.fillStyle='#d0a8a8';c.beginPath();c.arc(x,y-34,5,0,Math.PI*2);c.fill();c.fillStyle='#aa1010';c.fillRect(x-3,y-34,2,1);c.fillRect(x+1,y-34,2,1);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTeke(c,w*0.3,h*0.7);
  if(t<0.6){const tt=t/0.6;const ang=-Math.PI/3+tt*Math.PI*0.6;
    for(let k=4;k>=0;k--){const a2=-Math.PI/3+(tt-k*0.04)*Math.PI*0.6;
      const x=w*0.3+15+Math.cos(a2)*45,y=h*0.65+Math.sin(a2)*45;
      c.strokeStyle=`rgba(180,180,180,${0.6-k*0.1})`;c.lineWidth=3;c.beginPath();c.moveTo(w*0.3+15,h*0.65);c.lineTo(x,y);c.stroke();}
    // 爪
    c.fillStyle='#aaa';c.beginPath();c.moveTo(w*0.3+15+Math.cos(ang)*45,h*0.65+Math.sin(ang)*45);
    c.lineTo(w*0.3+15+Math.cos(ang)*55,h*0.65+Math.sin(ang)*55);c.lineTo(w*0.3+18+Math.cos(ang+0.1)*45,h*0.65+Math.sin(ang+0.1)*45);c.closePath();c.fill();
  }else{const tt=(t-0.6)/0.4;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawTeke(c,w*0.3,h*0.7);
  const phase=t*4;const idx=Math.floor(phase);const sub=phase-idx;
  for(let k=0;k<4;k++){const ang=-0.6+Math.sin(t*Math.PI*8+k)*0.4;
    c.strokeStyle=`rgba(255,170,68,${0.5-k*0.1})`;c.lineWidth=3;c.lineCap='round';
    c.beginPath();c.moveTo(w*0.3+15,h*0.65);c.lineTo(w*0.3+15+Math.cos(ang)*40,h*0.65+Math.sin(ang)*40);c.stroke();}c.lineCap='butt';
  if(sub<0.4){c.fillStyle=`rgba(255,255,200,${(1-sub*2.5)*0.7})`;c.beginPath();c.arc(tg.x,tg.y-16,15,0,Math.PI*2);c.fill();}
  c.fillStyle='#ffaa44';c.font='bold 18px sans-serif';c.textAlign='center';c.fillText((idx+1)+' HIT',tg.x,h*0.95);
},1400);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};for(let i=0;i<3;i++)drawEnemy(c,w*0.45+i*40,h*0.7);
  const x=20+t*(w-30);
  for(let k=0;k<6;k++){const xk=Math.max(20,x-k*16);
    c.fillStyle=`rgba(255,210,74,${0.5-k*0.07})`;c.fillRect(xk-12,h*0.69,16,3);}
  drawTeke(c,x,h*0.7);
  // 速度線
  for(let i=0;i<8;i++){const yy=h*0.62+Math.sin(t*10+i)*3+i*3;
    c.strokeStyle=`rgba(255,210,74,${0.5-i*0.05})`;c.lineWidth=1.5;c.beginPath();c.moveTo(x-60+i*4,yy);c.lineTo(x-20+i*4,yy);c.stroke();}
},1400);
</script></body></html>
