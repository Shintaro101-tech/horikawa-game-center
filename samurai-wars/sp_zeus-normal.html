<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ゼウス 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0a40 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#88aaff;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(15,20,30,0.7);border:2px solid var(--c,#88aaff);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(136,170,255,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0a40 0%,#503090 70%,#3a2060 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#88aaff);margin-bottom:6px}p{font-size:0.8rem;color:#cef;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>⚡ ゼウス — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「神罰（天雷柱）」を維持</div>
<div class="grid">
<div class="card" style="--c:#aaa;--g:rgba(170,170,170,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 神の拳</h2><p>嵐の力を込めた拳で殴る近接単発。</p></div>
<div class="card" style="--c:#88aaff;--g:rgba(136,170,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 雷弾</h2><p>青い雷弾を1発、遠距離発射。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 雷鞭</h2><p>雷の鞭で中距離の敵を打つ。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#503090';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a2060';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ffd24a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawZeus(c,x,y){c.fillStyle='#3a4a8a';c.fillRect(x-13,y-36,26,36);c.fillStyle='#aaaaaa';c.fillRect(x-13,y-30,26,8);c.fillStyle='#3a4a8a';c.beginPath();c.arc(x,y-44,9,0,Math.PI*2);c.fill();c.fillStyle='#ddd';c.fillRect(x-9,y-42,18,3);c.fillStyle='#fff';c.beginPath();c.moveTo(x-9,y-50);c.lineTo(x-11,y-58);c.lineTo(x-5,y-52);c.closePath();c.fill();c.beginPath();c.moveTo(x,y-52);c.lineTo(x-2,y-62);c.lineTo(x+4,y-54);c.closePath();c.fill();c.beginPath();c.moveTo(x+8,y-50);c.lineTo(x+11,y-58);c.lineTo(x+4,y-52);c.closePath();c.fill();c.fillStyle='#fff';c.fillRect(x-4,y-44,1.5,1.5);c.fillRect(x+2.5,y-44,1.5,1.5);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawZeus(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+13+tt*22;
    c.fillStyle='#aaa';c.fillRect(x-10,h*0.62-10,20,20);
    // 雷スパーク
    for(let k=0;k<5;k++){const a=k*Math.PI*0.4+t*8;c.strokeStyle='#88aaff';c.lineWidth=1.5;c.beginPath();c.moveTo(x,h*0.62);c.lineTo(x+Math.cos(a)*15,h*0.62+Math.sin(a)*15);c.stroke();}
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawZeus(c,w*0.25,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+13+tt*(tg.x-w*0.25-25);
    c.fillStyle='rgba(136,170,255,0.95)';c.beginPath();c.arc(x,h*0.6,9,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,0.9)';c.beginPath();c.arc(x,h*0.6,4,0,Math.PI*2);c.fill();
    // 雷の枝
    for(let k=0;k<4;k++){const ang=k*Math.PI/2+t*8;c.strokeStyle='rgba(136,170,255,0.7)';c.lineWidth=1.5;c.beginPath();c.moveTo(x,h*0.6);c.lineTo(x+Math.cos(ang)*8,h*0.6+Math.sin(ang)*8);c.stroke();}
  }else{c.fillStyle=`rgba(136,170,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawZeus(c,w*0.2,h*0.7);
  const x=w*0.2+15,y=h*0.62;
  // 雷の鞭（うねる）
  c.strokeStyle='#ffd24a';c.lineWidth=3;c.lineCap='round';
  c.beginPath();
  for(let i=0;i<=15;i++){const p=i/15;const px=x+(tg.x-x)*p;const py=y+Math.sin(p*Math.PI*5+t*8)*12;if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
  c.stroke();
  c.strokeStyle='#fff';c.lineWidth=1;
  c.beginPath();
  for(let i=0;i<=15;i++){const p=i/15;const px=x+(tg.x-x)*p;const py=y+Math.sin(p*Math.PI*5+t*8)*12;if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
  c.stroke();c.lineCap='butt';
  // 着弾
  if(t>0.6){c.fillStyle=`rgba(255,210,74,${1-(t-0.6)/0.4})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
