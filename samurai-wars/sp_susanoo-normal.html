<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>スサノオ 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#1a0a40 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ffd24a;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(30,20,8,0.7);border:2px solid var(--c,#ffd24a);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,210,74,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#1a0a40 0%,#503090 70%,#3a2060 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ffd24a);margin-bottom:6px}p{font-size:0.8rem;color:#fec;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>⚔ スサノオ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「神剣一閃（十拳剣の横一閃）」を維持</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 十拳剣突き</h2><p>金の剣で前方を突く近接単発。</p></div>
<div class="card" style="--c:#aa1010;--g:rgba(170,16,16,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 鉄拳</h2><p>金の籠手で殴る近接単発。</p></div>
<div class="card" style="--c:#fff;--g:rgba(255,255,255,0.4)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 神威の矢</h2><p>光輪から放たれる金の矢、遠距離単発。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#503090';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a2060';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ffd24a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawSusanoo(c,x,y){c.fillStyle='#ffd24a';c.fillRect(x-12,y-32,24,32);c.fillStyle='#aa1010';c.fillRect(x-12,y-32,24,4);c.fillRect(x-12,y-12,24,4);c.fillStyle='#ffd24a';c.beginPath();c.arc(x,y-42,8,0,Math.PI*2);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y-42,13,0,Math.PI*2);c.stroke();c.fillStyle='#000';c.fillRect(x-3,y-42,1.5,1.5);c.fillRect(x+1.5,y-42,1.5,1.5);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSusanoo(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+12+tt*30;
    c.save();c.translate(x,h*0.6);c.rotate(-0.1);
    c.fillStyle='#dde8f0';c.fillRect(-2,-22,4,44);c.fillStyle='#ffd24a';c.fillRect(-4,-26,8,8);c.restore();
  }else{c.fillStyle=`rgba(255,210,74,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(255,255,200,${1-(t-0.4)/0.6})`;c.lineWidth=3;c.beginPath();c.moveTo(tg.x-10,tg.y-22);c.lineTo(tg.x+10,tg.y-10);c.stroke();}
},1400);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSusanoo(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const x=w*0.3+12+tt*22;
    c.fillStyle='#ffd24a';c.fillRect(x-10,h*0.6-10,20,20);c.fillStyle='#aa1010';c.fillRect(x-8,h*0.6-8,4,4);c.fillRect(x+4,h*0.6-6,4,4);
  }else{c.fillStyle=`rgba(255,255,200,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(170,16,16,${1-(t-0.4)/0.6})`;c.lineWidth=3;c.beginPath();c.arc(tg.x,tg.y-16,28+(t-0.4)*40,0,Math.PI*2);c.stroke();}
},1400);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSusanoo(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+15+tt*(tg.x-w*0.2-25);
    c.save();c.translate(x,h*0.55);c.rotate(0.1);
    c.fillStyle='#fff';c.fillRect(-12,-1,24,2);c.fillStyle='#ffd24a';c.beginPath();c.moveTo(12,-4);c.lineTo(20,0);c.lineTo(12,4);c.closePath();c.fill();c.restore();
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.06);const xk=w*0.2+15+tk*(tg.x-w*0.2-25);
      c.fillStyle=`rgba(255,255,255,${0.4-k*0.08})`;c.fillRect(xk-8,h*0.55-1,12,2);}
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,210,74,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,12,0,Math.PI*2);c.fill();}
},1600);
</script></body></html>
