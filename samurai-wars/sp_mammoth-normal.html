<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>マンモス 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#0a1830 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#aaccff;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,20,30,0.7);border:2px solid var(--c,#aaccff);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(170,204,255,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a1830 0%,#3a5a8a 70%,#aacce0 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#aaccff);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🦣 マンモス — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「足踏み地震」を維持</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 牙突き</h2><p>2本の長い牙で前方を突く近接単発。</p></div>
<div class="card" style="--c:#aa6644;--g:rgba(170,102,68,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 鼻の薙ぎ払い</h2><p>長い鼻で前方を払う近接AOE。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 踏みつけ</h2><p>足元の敵を踏む狭範囲AOE。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#3a5a8a';c.fillRect(0,0,w,h*0.7);c.fillStyle='#aacce0';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#3a4a5a';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawMammoth(c,x,y){c.fillStyle='#aa6644';c.beginPath();c.ellipse(x,y-18,28,18,0,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(x+20,y-22,12,10,0,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.moveTo(x+28,y-18);c.lineTo(x+44,y-12);c.lineTo(x+30,y-15);c.closePath();c.fill();c.beginPath();c.moveTo(x+28,y-22);c.lineTo(x+42,y-18);c.lineTo(x+30,y-19);c.closePath();c.fill();c.strokeStyle='#aa6644';c.lineWidth=4;c.beginPath();c.moveTo(x+28,y-18);c.quadraticCurveTo(x+38,y-8,x+30,y);c.stroke();c.fillStyle='#aa6644';c.fillRect(x-22,y-3,7,12);c.fillRect(x-10,y-3,7,12);c.fillRect(x+5,y-3,7,12);c.fillRect(x+17,y-3,7,12);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMammoth(c,w*0.3,h*0.7);
  if(t<0.4){const tt=t/0.4;const dx=tt*12;
    c.fillStyle='#fff';c.beginPath();c.moveTo(w*0.3+28+dx,h*0.66);c.lineTo(w*0.3+44+dx,h*0.72);c.lineTo(w*0.3+30+dx,h*0.7);c.closePath();c.fill();
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.4)/0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMammoth(c,w*0.3,h*0.7);
  const cx=w*0.3+28,cy=h*0.65;const ang=Math.sin(t*Math.PI*2)*0.8;
  for(let k=4;k>=0;k--){const a2=Math.sin((t-k*0.04)*Math.PI*2)*0.8;
    c.save();c.translate(cx,cy);c.rotate(a2);c.strokeStyle=`rgba(170,102,68,${0.7-k*0.13})`;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(15,8,40,12);c.stroke();c.restore();}c.lineCap='butt';
},1600);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.5,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawMammoth(c,w*0.3,h*0.7);
  if(t<0.3){const tt=t/0.3;c.fillStyle='#aa6644';c.fillRect(w*0.3-22,h*0.65-tt*5,30,16);}
  else{const tt=(t-0.3)/0.7;
    c.fillStyle=`rgba(170,102,68,${1-tt})`;c.beginPath();c.ellipse(w*0.3-5,h*0.7,40+tt*30,8,0,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(255,210,74,${1-tt})`;c.lineWidth=3;c.beginPath();c.ellipse(w*0.3-5,h*0.7,30+tt*40,5,0,0,Math.PI*2);c.stroke();}
},1500);
</script></body></html>
