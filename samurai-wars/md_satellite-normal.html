<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>サテライト・ゼロ 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#000020 0%,#0a0a40 70%,#1a1a3a 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🛰 サテライト・ゼロ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（キルセイト全画面爆撃）はそのまま。味方として使うとき通常攻撃も決まります</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 小型レーザー</h2><p>砲身から細い金色レーザーを1発。</p></div>
<div class="card" style="--c:#aa1010;--g:rgba(170,16,16,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. プラズマ弾</h2><p>赤いプラズマ球を1発、中距離発射。</p></div>
<div class="card" style="--c:#00f0ff;--g:rgba(0,240,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 地上スキャン</h2><p>下方向にスキャン光線、当たった敵にダメージ。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#000020');sky.addColorStop(1,'#1a0a40');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#0a0a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#ff3344';c.fillRect(0,h*0.7,w,1);for(let i=0;i<15;i++){c.fillStyle='#fff';c.fillRect((i*23)%w,(i*13)%(h*0.5),1,1);}}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawSat(c,x,y){c.fillStyle='#3a0808';c.fillRect(x-30,y-8,16,16);c.fillRect(x+14,y-8,16,16);c.strokeStyle='#ffd24a';c.lineWidth=0.6;for(let i=1;i<3;i++){c.beginPath();c.moveTo(x-30+i*5,y-8);c.lineTo(x-30+i*5,y+8);c.stroke();c.beginPath();c.moveTo(x+14+i*5,y-8);c.lineTo(x+14+i*5,y+8);c.stroke();}c.fillStyle='#aa1010';c.fillRect(x-14,y-14,28,22);c.fillStyle='#3a0808';c.fillRect(x-10,y-10,20,4);c.fillStyle='#ffd24a';c.fillRect(x-14,y-14,28,2);c.fillRect(x-14,y+6,28,2);c.fillStyle='#0a0a0a';c.fillRect(x-8,y-4,16,6);c.fillStyle='#ffd24a';c.beginPath();c.arc(x,y-1,2,0,Math.PI*2);c.fill();c.fillStyle='#1a1a1a';c.fillRect(x-6,y+8,12,14);c.fillStyle='#5a0808';c.fillRect(x-5,y+10,10,11);c.fillStyle='#ffd24a';c.beginPath();c.arc(x,y+21,2.5,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSat(c,w*0.25,h*0.3);
  if(t<0.3){const tt=t/0.3;c.fillStyle=`rgba(255,210,74,${tt*0.9})`;c.beginPath();c.arc(w*0.25,h*0.3+21,6*tt,0,Math.PI*2);c.fill();}
  else{const tt=(t-0.3)/0.7;
    c.strokeStyle=`rgba(255,210,74,${1-tt*0.4})`;c.lineWidth=5;c.beginPath();c.moveTo(w*0.25,h*0.3+21);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.strokeStyle=`rgba(255,255,255,${1-tt*0.4})`;c.lineWidth=2;c.beginPath();c.moveTo(w*0.25,h*0.3+21);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,15+tt*10,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSat(c,w*0.25,h*0.3);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+tt*(tg.x-w*0.25-10);const y=h*0.3+21+tt*(tg.y-16-h*0.35);
    c.fillStyle=`rgba(255,80,80,0.85)`;c.beginPath();c.arc(x,y,9-tt*2,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,210,74,0.9)`;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,255,0.95)`;c.beginPath();c.arc(x,y,2,0,Math.PI*2);c.fill();
    for(let k=1;k<5;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.25+tk*(tg.x-w*0.25-10);const yk=h*0.3+21+tk*(tg.y-16-h*0.35);
      c.fillStyle=`rgba(170,16,16,${0.5-k*0.1})`;c.beginPath();c.arc(xk,yk,7-k,0,Math.PI*2);c.fill();}
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(170,16,16,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,25+tt*10,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,14,0,Math.PI*2);c.fill();}
},1700);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawSat(c,w*0.45,h*0.3);
  // 下方向スキャン光線（横にスイープ）
  const scanX = w*0.45 + Math.sin(t*Math.PI*2)*100;
  c.fillStyle=`rgba(0,240,255,${0.3+Math.sin(t*Math.PI*4)*0.15})`;
  c.beginPath();c.moveTo(w*0.45-6,h*0.3+21);c.lineTo(scanX-30,h*0.7);c.lineTo(scanX+30,h*0.7);c.lineTo(w*0.45+6,h*0.3+21);c.closePath();c.fill();
  c.fillStyle=`rgba(180,230,255,0.5)`;
  c.beginPath();c.moveTo(w*0.45-2,h*0.3+21);c.lineTo(scanX-10,h*0.7);c.lineTo(scanX+10,h*0.7);c.lineTo(w*0.45+2,h*0.3+21);c.closePath();c.fill();
  // スキャンライン（地面）
  c.strokeStyle=`rgba(0,240,255,0.7)`;c.lineWidth=2;
  c.beginPath();c.ellipse(scanX,h*0.7,30,5,0,0,Math.PI*2);c.stroke();
  // 被弾エフェクト
  if(Math.abs(scanX-tg.x)<30){
    c.fillStyle=`rgba(0,240,255,${0.6})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();
  }
},2400);
</script></body></html>
