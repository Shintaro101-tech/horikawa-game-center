<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI兵器ガーディアン 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🤖 AI兵器ガーディアン — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（チャージビーム）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 機関銃</h2><p>連続射撃する高速単発。中距離。</p></div>
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 鉄拳パンチ</h2><p>巨大な鉄拳で近距離殴打。</p></div>
<div class="card" style="--c:#00f0ff;--g:rgba(0,240,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 小型レーザー</h2><p>細い青レーザー1発で狙撃。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#fff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawAI(c,x,y){c.fillStyle='#1a1a1a';c.fillRect(x-15,y-30,30,30);c.fillStyle='#aa1010';c.fillRect(x-12,y-26,24,5);c.fillStyle='#0a0a0a';c.fillRect(x-10,y-22,20,6);c.fillStyle='#ff0000';c.beginPath();c.arc(x,y-19,2.5,0,Math.PI*2);c.fill();c.fillStyle='#1a1a1a';c.fillRect(x-13,y-4,4,4);c.fillRect(x-5,y-4,4,4);c.fillRect(x+3,y-4,4,4);c.fillRect(x+11,y-4,4,4);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawAI(c,w*0.2,h*0.7);
  const phase=t*5;const idx=Math.floor(phase);
  for(let k=0;k<5;k++){const ph=t-k*0.1;if(ph<0||ph>0.6)continue;const tt=ph/0.6;
    const x=w*0.2+18+tt*(tg.x-w*0.2-30);
    c.fillStyle='#ffd24a';c.fillRect(x-3,h*0.61,6,2);
    c.fillStyle='rgba(255,210,74,0.4)';c.beginPath();c.arc(x,h*0.62,4,0,Math.PI*2);c.fill();}
  if(idx>0){c.fillStyle=`rgba(255,255,200,${(1-((t*5)%1))*0.5})`;c.beginPath();c.arc(tg.x,tg.y-16,12,0,Math.PI*2);c.fill();}
  // 砲口の発光
  c.fillStyle='rgba(255,210,74,0.6)';c.beginPath();c.arc(w*0.2+18,h*0.62,4+Math.sin(t*30)*1.5,0,Math.PI*2);c.fill();
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.5,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawAI(c,w*0.2,h*0.7);
  if(t<0.6){const tt=t/0.6;const x=w*0.2+15+tt*(tg.x-w*0.2-25);
    // 拳
    c.fillStyle='#5a5a5a';c.fillRect(x-12,h*0.6-10,24,20);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x-12,h*0.6-10,24,20);
    c.fillStyle='#aa1010';c.fillRect(x-10,h*0.6-8,4,4);c.fillRect(x-3,h*0.6-8,4,4);c.fillRect(x+4,h*0.6-8,4,4);
    // 残像
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.08);const xk=w*0.2+15+tk*(tg.x-w*0.2-25);
      c.fillStyle=`rgba(80,80,80,${0.5-k*0.1})`;c.fillRect(xk-12,h*0.6-10,24,20);}
  }else{const tt=(t-0.6)/0.4;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,20+tt*10,0,Math.PI*2);c.fill();
    // 衝撃波
    c.strokeStyle=`rgba(255,210,74,${1-tt})`;c.lineWidth=3;c.beginPath();c.arc(tg.x,tg.y-16,15+tt*30,0,Math.PI*2);c.stroke();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawAI(c,w*0.2,h*0.7);
  if(t<0.3){const tt=t/0.3;c.fillStyle=`rgba(0,240,255,${tt*0.8})`;c.beginPath();c.arc(w*0.2+15,h*0.62,8*tt,0,Math.PI*2);c.fill();}
  else{const tt=(t-0.3)/0.7;
    c.strokeStyle=`rgba(0,240,255,${1-tt*0.5})`;c.lineWidth=5;c.beginPath();c.moveTo(w*0.2+15,h*0.62);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.strokeStyle=`rgba(255,255,255,${1-tt*0.5})`;c.lineWidth=2;c.beginPath();c.moveTo(w*0.2+15,h*0.62);c.lineTo(tg.x,tg.y-16);c.stroke();
    c.fillStyle=`rgba(0,240,255,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,15+tt*8,0,Math.PI*2);c.fill();}
},1500);
</script></body></html>
