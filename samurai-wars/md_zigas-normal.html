<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ザイガス 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🏗 解体重機ザイガス — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（ドリル突進貫通）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#aa6600;--g:rgba(170,102,0,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 鉄球振り回し</h2><p>中型の鉄球で前方を薙ぐ近距離AOE。</p></div>
<div class="card" style="--c:#888;--g:rgba(136,136,136,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. クレーン叩きつけ</h2><p>クレーンアームを中距離に振り下ろし。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 小型ドリル突き</h2><p>小型ドリルを高速で突き入れる近距離単発。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#3a2a18');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#2a2010';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#aa6600';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawZigas(c,x,y){c.fillStyle='#1a1a1a';c.fillRect(x-20,y-8,40,8);c.fillStyle='#aaa';c.fillRect(x-15,y-30,30,22);c.fillStyle='#1a1a3a';c.fillRect(x-10,y-44,20,14);c.fillStyle='#00f0ff';c.fillRect(x-8,y-42,16,6);c.fillStyle='#aaa';c.fillRect(x-2,y-60,4,16);c.fillStyle='#00f0ff';c.beginPath();c.arc(x,y-18,3,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const enemies=[{x:w*0.55,y:h*0.7},{x:w*0.7,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawZigas(c,w*0.25,h*0.7);
  const cx=w*0.25+20,cy=h*0.55;const ang=-Math.PI/2+Math.sin(t*Math.PI*2)*Math.PI*0.55;const rr=60;
  // 残像
  for(let k=5;k>=0;k--){const a2=-Math.PI/2+Math.sin((t-k*0.04)*Math.PI*2)*Math.PI*0.55;
    c.strokeStyle=`rgba(170,102,0,${0.5-k*0.08})`;c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a2)*rr,cy+Math.sin(a2)*rr);c.stroke();
    c.fillStyle=`rgba(80,80,80,${0.5-k*0.08})`;c.beginPath();c.arc(cx+Math.cos(a2)*rr,cy+Math.sin(a2)*rr,8,0,Math.PI*2);c.fill();}
  c.strokeStyle='#5a3010';c.lineWidth=2.5;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr);c.stroke();
  c.fillStyle='#5a5a5a';c.beginPath();c.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,10,0,Math.PI*2);c.fill();
},1600);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawZigas(c,w*0.25,h*0.7);
  // クレーンアームが振り下ろされる
  const cx=w*0.25,cy=h*0.4;
  const ang = t<0.5 ? -Math.PI/4 - (1-t/0.5)*0.3 : -Math.PI/4 - (t-0.5)/0.5*0.4;
  if(t<0.7){c.save();c.translate(cx,cy);c.rotate(ang);
    c.fillStyle='#aaa';c.fillRect(0,-3,80,6);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(0,-3,80,6);
    // 鉄球
    c.fillStyle='#3a3a3a';c.beginPath();c.arc(78,0,10,0,Math.PI*2);c.fill();c.restore();}
  if(t>0.5){const tt=(t-0.5)/0.5;c.fillStyle=`rgba(170,102,0,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,22,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,10,0,Math.PI*2);c.fill();
    c.strokeStyle=`rgba(170,102,0,${1-tt})`;c.lineWidth=3;c.beginPath();c.arc(tg.x,tg.y,30+tt*40,0,Math.PI*2);c.stroke();}
},1700);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawZigas(c,w*0.25,h*0.7);
  const cx=w*0.25+20,cy=h*0.6;
  // 突き出す方向
  if(t<0.4){const tt=t/0.4;const x=cx+20+tt*30;
    // ドリル回転
    c.save();c.translate(x,cy);c.rotate(t*30);
    for(let k=0;k<5;k++){c.fillStyle=['#ffd24a','#aa6600'][k%2];
      c.beginPath();c.moveTo(0,0);c.lineTo(18,-3+k*1.5);c.lineTo(22,0);c.closePath();c.fill();
      c.beginPath();c.moveTo(0,0);c.lineTo(18,3-k*1.5);c.lineTo(22,0);c.closePath();c.fill();}
    c.fillStyle='#888';c.fillRect(0,-3,6,6);c.restore();
  }else if(t<0.7){const tt=(t-0.4)/0.3;const x=cx+50+tt*(tg.x-cx-70);
    c.save();c.translate(x,cy);c.rotate(t*30);
    for(let k=0;k<5;k++){c.fillStyle=['#ffd24a','#aa6600'][k%2];
      c.beginPath();c.moveTo(0,0);c.lineTo(18,-3+k*1.5);c.lineTo(22,0);c.closePath();c.fill();
      c.beginPath();c.moveTo(0,0);c.lineTo(18,3-k*1.5);c.lineTo(22,0);c.closePath();c.fill();}
    c.restore();
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16+tt*8,0,Math.PI*2);c.fill();
    for(let i=0;i<6;i++){c.fillStyle='#ffd24a';c.fillRect(tg.x+Math.cos(i)*15+Math.random()*5,tg.y-16+Math.sin(i)*10,3,3);}}
},1600);
</script></body></html>
