<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ラットキング 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;margin-bottom:6px}.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}p{font-size:0.8rem;color:#cdf;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🐀 ラットキング — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（5匹スウォーム）はそのまま。通常攻撃のみを選びます</div>
<div class="grid">
<div class="card" style="--c:#aaa;--g:rgba(170,170,170,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 爪斬り</h2><p>鋭い爪で近距離単発攻撃。</p></div>
<div class="card" style="--c:#aa1010;--g:rgba(170,16,16,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 噛みつき</h2><p>大きな牙で噛みつく強力な近距離攻撃。</p></div>
<div class="card" style="--c:#7a5a3a;--g:rgba(122,90,58,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 子ネズミ投擲</h2><p>1匹の子ネズミを中距離で飛ばす。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0608');sky.addColorStop(1,'#1a1018');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1410';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#5a3010';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawRatKing(c,x,y){c.fillStyle='#7a5a3a';c.beginPath();c.ellipse(x,y-10,20,12,0,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+15,y-15,8,0,Math.PI*2);c.fill();c.fillStyle='#ff3344';c.beginPath();c.arc(x+18,y-16,1.5,0,Math.PI*2);c.fill();c.fillStyle='#ffd24a';c.beginPath();c.moveTo(x-3,y-26);c.lineTo(x-2,y-32);c.lineTo(x+2,y-29);c.lineTo(x+5,y-34);c.lineTo(x+8,y-29);c.lineTo(x+10,y-32);c.lineTo(x+11,y-26);c.closePath();c.fill();}
function drawMiniRat(c,x,y){c.fillStyle='#7a5a3a';c.beginPath();c.ellipse(x,y,9,5,0,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+6,y-2,4,0,Math.PI*2);c.fill();c.fillStyle='#ff3344';c.beginPath();c.arc(x+7,y-3,1,0,Math.PI*2);c.fill();c.fillStyle='#000';c.beginPath();c.arc(x+9,y-2,0.7,0,Math.PI*2);c.fill();}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawRatKing(c,w*0.25,h*0.7);
  if(t<0.5){const tt=t/0.5;const ang=-Math.PI/3+tt*Math.PI*0.6;
    for(let k=4;k>=0;k--){const a2=-Math.PI/3+(tt-k*0.04)*Math.PI*0.6;
      const x=w*0.25+25+Math.cos(a2)*40,y=h*0.65+Math.sin(a2)*40;
      c.strokeStyle=`rgba(255,255,255,${0.7-k*0.1})`;c.lineWidth=4;c.beginPath();c.moveTo(w*0.25+25,h*0.65);c.lineTo(x,y);c.stroke();}
    // 爪（3本）
    const x=w*0.25+25+Math.cos(ang)*40,y=h*0.65+Math.sin(ang)*40;
    c.fillStyle='#fff';
    c.beginPath();c.moveTo(x-2,y-6);c.lineTo(x-3,y);c.lineTo(x+2,y-3);c.closePath();c.fill();
    c.beginPath();c.moveTo(x,y-8);c.lineTo(x+1,y-2);c.lineTo(x+4,y-5);c.closePath();c.fill();
    c.beginPath();c.moveTo(x+3,y-6);c.lineTo(x+4,y);c.lineTo(x+7,y-3);c.closePath();c.fill();
  }else{const tt=(t-0.5)/0.5;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();
    for(let i=0;i<3;i++){c.strokeStyle=`rgba(255,51,68,${1-tt})`;c.lineWidth=2;
      c.beginPath();c.moveTo(tg.x-10+i*3,tg.y-22);c.lineTo(tg.x-5+i*3,tg.y-10);c.stroke();}}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.5,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawRatKing(c,w*0.25,h*0.7);
  if(t<0.4){const tt=t/0.4;
    // 口を開けて飛びかかる
    const x=w*0.25+25+tt*(tg.x-w*0.25-35);
    c.fillStyle='#0a0a0a';c.beginPath();c.arc(x,h*0.65,10,0.2,Math.PI-0.2);c.fill();
    // 牙（大きい）
    c.fillStyle='#fff';
    c.beginPath();c.moveTo(x-4,h*0.65-2);c.lineTo(x-3,h*0.65+6);c.lineTo(x-2,h*0.65-2);c.closePath();c.fill();
    c.beginPath();c.moveTo(x+2,h*0.65-2);c.lineTo(x+3,h*0.65+6);c.lineTo(x+4,h*0.65-2);c.closePath();c.fill();
  }else{const tt=(t-0.4)/0.6;
    c.fillStyle=`rgba(170,16,16,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,20+tt*8,0,Math.PI*2);c.fill();
    c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,10,0,Math.PI*2);c.fill();
    // 牙痕
    c.strokeStyle=`rgba(255,255,255,${1-tt})`;c.lineWidth=3;
    c.beginPath();c.moveTo(tg.x-5,tg.y-20);c.lineTo(tg.x-3,tg.y-10);c.stroke();
    c.beginPath();c.moveTo(tg.x+3,tg.y-20);c.lineTo(tg.x+5,tg.y-10);c.stroke();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawRatKing(c,w*0.2,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.2+22+tt*(tg.x-w*0.2-35);const y=h*0.6-Math.sin(tt*Math.PI)*30;
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.05);const xk=w*0.2+22+tk*(tg.x-w*0.2-35);const yk=h*0.6-Math.sin(tk*Math.PI)*30;
      c.fillStyle=`rgba(122,90,58,${0.4-k*0.08})`;c.beginPath();c.ellipse(xk,yk,7-k,4-k*0.5,0,0,Math.PI*2);c.fill();}
    drawMiniRat(c,x,y);
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(170,102,68,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();
    drawMiniRat(c,tg.x-8,tg.y-15);}
},1700);
</script></body></html>
