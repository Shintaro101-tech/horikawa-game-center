<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪盗ブラックタイガー 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;text-shadow:0 0 20px rgba(255,51,68,0.5);margin-bottom:6px}
.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}
.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}
canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}
p{font-size:0.8rem;color:#cdf;line-height:1.4}
footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🎭 怪盗ブラックタイガー — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（トランプ8方向投擲）はそのまま。通常攻撃のみを選びます</div>

<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. ステッキ突き</h2><p>金のステッキで素早く突く近距離単発。</p></div>
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. ナイフ投擲</h2><p>1本のナイフを正確に投げる中距離単発。</p></div>
<div class="card" style="--c:#aa66ff;--g:rgba(170,102,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. スモーク斬り</h2><p>煙幕を張りつつ近距離で斬りつける中範囲。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>

<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#fff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawKaitou(c,x,y){c.fillStyle='#0a0a0a';c.fillRect(x-10,y-32,20,32);c.fillStyle='#fff';c.fillRect(x-2,y-32,4,32);c.fillStyle='#aa1010';c.beginPath();c.moveTo(x-3,y-28);c.lineTo(x-5,y-24);c.lineTo(x-3,y-20);c.closePath();c.fill();c.beginPath();c.moveTo(x+3,y-28);c.lineTo(x+5,y-24);c.lineTo(x+3,y-20);c.closePath();c.fill();c.fillStyle='#f0d4a8';c.beginPath();c.arc(x,y-38,5,0,Math.PI*2);c.fill();c.fillStyle='#000';c.fillRect(x-6,y-40,12,2);c.fillStyle='#ff3344';c.fillRect(x-4,y-39,2,1);c.fillRect(x+2,y-39,2,1);c.fillStyle='#000';c.fillRect(x-7,y-46,14,7);}

// 案A: ステッキ突き
startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawKaitou(c,50,h*0.7);
  if(t<0.4){const tt=t/0.4;c.save();c.translate(60,h*0.6);c.rotate(-Math.PI/4-tt*0.3);
    c.strokeStyle='#5a3010';c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.lineTo(30,0);c.stroke();
    c.fillStyle='#ffd24a';c.beginPath();c.arc(30,0,4,0,Math.PI*2);c.fill();c.restore();
  }else if(t<0.65){const tt=(t-0.4)/0.25;const x=60+(tg.x-70)*tt;
    c.strokeStyle='#5a3010';c.lineWidth=3;c.beginPath();c.moveTo(60,h*0.6);c.lineTo(x+30,h*0.62);c.stroke();
    c.fillStyle='#ffd24a';c.beginPath();c.arc(x+30,h*0.62,4,0,Math.PI*2);c.fill();
  }else{const tt=(t-0.65)/0.35;c.fillStyle=`rgba(255,210,74,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16+tt*10,0,Math.PI*2);c.fill();}
},1600);

// 案B: ナイフ投擲
startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawKaitou(c,50,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=60+tt*(tg.x-70);const y=h*0.55-Math.sin(tt*Math.PI)*15;
    for(let k=0;k<4;k++){const tk=Math.max(0,tt-k*0.06);const xk=60+tk*(tg.x-70);
      c.strokeStyle=`rgba(221,232,240,${0.5-k*0.1})`;c.lineWidth=2;c.beginPath();c.moveTo(xk-12,y);c.lineTo(xk+12,y);c.stroke();}
    c.save();c.translate(x,y);c.rotate(tt*Math.PI*6);
    c.fillStyle='#aaa';c.fillRect(-10,-1,20,2);c.fillStyle='#dde8f0';c.beginPath();c.moveTo(10,-3);c.lineTo(16,0);c.lineTo(10,3);c.closePath();c.fill();
    c.restore();
  }else{const tt=(t-0.7)/0.3;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1700);

// 案C: スモーク斬り
startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);
  // 煙幕
  for(let i=0;i<14;i++){const ang=(i/14)*Math.PI*2+t*0.8;const rr=30+Math.sin(t*Math.PI*2+i)*8;
    c.fillStyle=`rgba(170,102,255,${0.3+Math.sin(t*Math.PI*2+i*0.3)*0.1})`;
    c.beginPath();c.arc(tg.x+Math.cos(ang)*rr,tg.y-25+Math.sin(ang)*rr*0.5,8,0,Math.PI*2);c.fill();}
  // 怪盗が煙の中から現れて斬る
  if(t>0.3&&t<0.7){const tt=(t-0.3)/0.4;c.globalAlpha=0.7;drawKaitou(c,tg.x-25,tg.y);c.globalAlpha=1;
    c.strokeStyle=`rgba(170,102,255,${0.9})`;c.lineWidth=4;c.lineCap='round';
    c.beginPath();c.moveTo(tg.x-25,tg.y-20);c.lineTo(tg.x+10,tg.y-25);c.stroke();c.lineCap='butt';}
  if(t>0.6){const tt=(t-0.6)/0.4;c.fillStyle=`rgba(255,255,200,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();}
},1800);
</script></body></html>
