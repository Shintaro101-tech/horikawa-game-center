<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暴走族頭領 通常攻撃3案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4a0080 0%,transparent 60%),linear-gradient(180deg,#0a0020 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#ff3344;text-shadow:0 0 20px rgba(255,51,68,0.5);margin-bottom:6px}
.sub{text-align:center;color:#18FFFF;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}
.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(20,10,30,0.7);border:2px solid var(--c,#ff3344);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(255,51,68,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a0020 0%,#1a0a40 70%,#2a1858 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}
canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#ff3344);margin-bottom:6px}
p{font-size:0.8rem;color:#cdf;line-height:1.4}
footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}
</style></head><body>
<h1>🏍 暴走族頭領 — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">※ 必殺技（バイク特攻突進）はそのまま。通常攻撃のみを選びます</div>

<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 金棒振り下ろし</h2><p>近距離で金棒を振り下ろす単発攻撃。素直に強い。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. チェーン振り回し</h2><p>鎖を斜めに振って前方を薙ぐ中範囲攻撃。</p></div>
<div class="card" style="--c:#88ddaa;--g:rgba(136,221,170,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. ボトル投擲</h2><p>瓶を投げて中距離の単発ダメージ。割れて飛沫。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>

<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){const sky=c.createLinearGradient(0,0,0,h*0.7);sky.addColorStop(0,'#0a0820');sky.addColorStop(1,'#1a1850');c.fillStyle=sky;c.fillRect(0,0,w,h*0.7);c.fillStyle='#1a1a28';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#fff';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawBouso(c,x,y){c.fillStyle='#1a1a1a';c.fillRect(x-12,y-32,24,32);c.fillStyle='#e0b888';c.beginPath();c.arc(x,y-38,6,0,Math.PI*2);c.fill();c.fillStyle='#000';c.beginPath();c.moveTo(x-6,y-38);c.quadraticCurveTo(x-9,y-48,x,y-44);c.quadraticCurveTo(x+3,y-48,x+6,y-40);c.closePath();c.fill();c.fillStyle='#ffd24a';c.font='bold 7px sans-serif';c.textAlign='center';c.fillText('特',x,y-20);}

// 案A: 金棒振り下ろし
startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBouso(c,50,h*0.7);
  c.save();c.translate(50,h*0.55);
  const ang=t<0.5?-Math.PI/2+t*2*Math.PI*0.6:-Math.PI/2+0.6*Math.PI-(t-0.5)*2*Math.PI*0.7;
  c.rotate(ang);c.strokeStyle='#777';c.lineWidth=5;c.beginPath();c.moveTo(0,0);c.lineTo(50,0);c.stroke();
  c.fillStyle='#aaa';c.fillRect(45,-5,8,10);c.restore();
  if(t>0.7){c.fillStyle=`rgba(255,255,200,${(1-(t-0.7)/0.3)})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1500);

// 案B: チェーン振り回し
startAnim('at-b',(c,t,w,h)=>{const enemies=[{x:w*0.5,y:h*0.7},{x:w*0.65,y:h*0.7}];enemies.forEach(e=>drawEnemy(c,e.x,e.y));drawBouso(c,50,h*0.7);
  const cx=50,cy=h*0.55;const ang=-Math.PI*0.3+Math.sin(t*Math.PI*2)*Math.PI*0.55;const r=90;
  for(let k=4;k>=0;k--){const a2=-Math.PI*0.3+Math.sin((t-k*0.04)*Math.PI*2)*Math.PI*0.55;
    c.strokeStyle=`rgba(255,210,74,${0.6-k*0.1})`;c.lineWidth=8-k;c.lineCap='round';
    c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r);c.stroke();}
  c.lineCap='butt';
  c.strokeStyle='#888';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);
  for(let i=1;i<=5;i++){c.lineTo(cx+Math.cos(ang)*r*(i/5),cy+Math.sin(ang)*r*(i/5));}c.stroke();
  c.fillStyle='#aaa';c.beginPath();c.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,6,0,Math.PI*2);c.fill();
},1600);

// 案C: ボトル投擲
startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBouso(c,50,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=60+tt*(tg.x-70);const y=h*0.55-Math.sin(tt*Math.PI)*30;
    c.save();c.translate(x,y);c.rotate(tt*Math.PI*4);
    c.fillStyle='#88ccff';c.fillRect(-4,-7,8,14);c.fillStyle='#88ddaa';c.fillRect(-4,-9,8,3);
    c.restore();}
  else{const tt=(t-0.7)/0.3;
    c.fillStyle=`rgba(136,221,170,${1-tt})`;c.beginPath();c.arc(tg.x,tg.y-16,20+tt*10,0,Math.PI*2);c.fill();
    for(let k=0;k<8;k++){const ang=k*Math.PI/4;c.fillStyle=`rgba(136,221,170,${1-tt})`;
      c.fillRect(tg.x+Math.cos(ang)*tt*30,tg.y-16+Math.sin(ang)*tt*20,3,3);}}
},1800);
</script></body></html>
