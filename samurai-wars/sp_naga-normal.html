<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ナーガ 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#0a2010 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#5aaa66;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(15,30,15,0.7);border:2px solid var(--c,#5aaa66);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(90,170,102,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a2010 0%,#264a18 70%,#3a4a18 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#5aaa66);margin-bottom:6px}p{font-size:0.8rem;color:#dfd;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>🐍 ナーガ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「三蛇召喚」を維持</div>
<div class="grid">
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 三叉槍突き</h2><p>金の三叉槍で突く中距離単発。</p></div>
<div class="card" style="--c:#88dd66;--g:rgba(136,221,102,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 毒霧</h2><p>口から毒の霧を前方コーンに吐く。</p></div>
<div class="card" style="--c:#aa44ff;--g:rgba(170,68,255,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 蛇鞭</h2><p>髪の蛇が鞭となって遠距離攻撃。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#264a18';c.fillRect(0,0,w,h*0.7);c.fillStyle='#3a4a18';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#88aa44';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawNaga(c,x,y){c.fillStyle='#5aaa66';c.fillRect(x-10,y-28,20,28);c.fillStyle='#3a8a4a';c.fillRect(x-12,y-22,24,3);c.fillStyle='#f0d4a8';c.beginPath();c.arc(x,y-36,7,0,Math.PI*2);c.fill();c.fillStyle='#88ff44';for(let i=0;i<5;i++){c.beginPath();c.arc(x-9+i*4,y-44,3,0,Math.PI*2);c.fill();}c.fillStyle='#5aaa66';c.fillRect(x-13,y-32,5,12);c.fillRect(x+8,y-32,5,12);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawNaga(c,w*0.25,h*0.7);
  if(t<0.5){const tt=t/0.5;const x=w*0.25+13+tt*(tg.x-w*0.25-30);
    c.fillStyle='#ffd24a';c.fillRect(x-12,h*0.6-1,30,3);c.beginPath();c.moveTo(x+18,h*0.6-5);c.lineTo(x+25,h*0.6);c.lineTo(x+18,h*0.6+5);c.closePath();c.fill();c.fillRect(x+15,h*0.6-3,3,7);
  }else{c.fillStyle=`rgba(255,210,74,${1-(t-0.5)/0.5})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.6,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawNaga(c,w*0.25,h*0.7);
  for(let i=0;i<30;i++){const ang=-0.2+(Math.sin(i*7+t*5)*0.4);const dist=t*180+Math.sin(i*3)*30+30;
    c.fillStyle=`rgba(136,221,102,${0.4+Math.random()*0.3})`;c.beginPath();c.arc(w*0.25+15+Math.cos(ang)*dist,h*0.6+Math.sin(ang)*dist*0.3,5+Math.random()*3,0,Math.PI*2);c.fill();}
  c.fillStyle='#88dd66';c.font='bold 18px sans-serif';c.fillText('☠',tg.x,tg.y-30);
},1700);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.7,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawNaga(c,w*0.2,h*0.7);
  const x=w*0.2+15,y=h*0.62;
  // 蛇の鞭（うねる）
  c.strokeStyle='#88ff44';c.lineWidth=4;c.lineCap='round';
  c.beginPath();
  for(let i=0;i<=20;i++){const p=i/20;const px=x+(tg.x-x)*p;const py=y+Math.sin(p*Math.PI*4+t*5)*15;if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
  c.stroke();c.lineCap='butt';
  // 先端の蛇頭
  c.fillStyle='#88ff44';c.beginPath();c.arc(tg.x,y+Math.sin(Math.PI*4+t*5)*15,5,0,Math.PI*2);c.fill();
  c.fillStyle='#ff3344';c.beginPath();c.arc(tg.x+2,y+Math.sin(Math.PI*4+t*5)*15-1,1,0,Math.PI*2);c.fill();
  if(t>0.6){c.fillStyle=`rgba(170,68,255,${1-(t-0.6)/0.4})`;c.beginPath();c.arc(tg.x,tg.y-16,18,0,Math.PI*2);c.fill();}
},1700);
</script></body></html>
