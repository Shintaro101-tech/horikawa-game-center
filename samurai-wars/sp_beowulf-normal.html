<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ベオウルフ 通常攻撃3案</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#0a1430 0%,transparent 60%),linear-gradient(180deg,#0a0a08 0%,#000 100%);min-height:100vh;padding:24px 16px 40px}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#aaccff;margin-bottom:6px}.sub{text-align:center;color:#88dd44;font-size:0.85rem;letter-spacing:3px;opacity:0.8;margin-bottom:8px}.note{text-align:center;color:#888;font-size:0.78rem;margin-bottom:20px}
.grid{display:grid;gap:14px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(15,20,30,0.7);border:2px solid var(--c,#aaccff);border-radius:14px;padding:14px;box-shadow:0 0 18px var(--g,rgba(170,204,255,0.3))}
.canv-wrap{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0a1430 0%,#3a4a6a 70%,#aaccff 100%);border-radius:10px;padding:8px;margin-bottom:10px;min-height:200px}canvas{display:block;max-width:100%;height:auto}
h2{font-size:0.95rem;color:var(--c,#aaccff);margin-bottom:6px}p{font-size:0.8rem;color:#cef;line-height:1.4}footer{text-align:center;margin-top:28px;color:#607D8B;font-size:0.75rem}</style></head><body>
<h1>⚔ ベオウルフ — 通常攻撃 3案</h1>
<div class="sub">NORMAL ATTACK CANDIDATES</div>
<div class="note">必殺技は「雷斬一閃」を維持</div>
<div class="grid">
<div class="card" style="--c:#dde8f0;--g:rgba(221,232,240,0.4)"><div class="canv-wrap"><canvas id="at-a" width="280" height="200"></canvas></div><h2>案A. 剣振り</h2><p>大剣で振り下ろす近接単発。</p></div>
<div class="card" style="--c:#88aaff;--g:rgba(136,170,255,0.5)"><div class="canv-wrap"><canvas id="at-b" width="280" height="200"></canvas></div><h2>案B. 雷の矢</h2><p>青い雷の矢を中距離発射。</p></div>
<div class="card" style="--c:#ffd24a;--g:rgba(255,210,74,0.5)"><div class="canv-wrap"><canvas id="at-c" width="280" height="200"></canvas></div><h2>案C. 二段斬り</h2><p>剣を素早く2連続振り下ろし。</p></div>
</div>
<footer>© HORIKAWA FAMILY · NORMAL ATTACK PREVIEW</footer>
<script>
function startAnim(id,fn,dur){const cv=document.getElementById(id);const ctx=cv.getContext('2d');const start=performance.now();function loop(){const t=((performance.now()-start)%dur)/dur;ctx.clearRect(0,0,cv.width,cv.height);drawScene(ctx,cv.width,cv.height);fn(ctx,t,cv.width,cv.height);requestAnimationFrame(loop);}loop();}
function drawScene(c,w,h){c.fillStyle='#3a4a6a';c.fillRect(0,0,w,h*0.7);c.fillStyle='#aaccff';c.fillRect(0,h*0.7,w,h*0.3);c.fillStyle='#dde8f0';c.fillRect(0,h*0.7,w,1);}
function drawEnemy(c,x,y){c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(x,y,10,3,0,0,Math.PI*2);c.fill();c.fillStyle='#5a1a1a';c.fillRect(x-6,y-22,12,22);c.fillStyle='#3a0808';c.beginPath();c.arc(x,y-26,5,0,Math.PI*2);c.fill();}
function drawBeowulf(c,x,y){c.fillStyle='#5a5a5a';c.fillRect(x-10,y-30,20,30);c.fillStyle='#aaccee';c.fillRect(x-10,y-30,20,3);c.fillStyle='#5a5a5a';c.beginPath();c.arc(x,y-38,7,0,Math.PI*2);c.fill();c.fillStyle='#ffd24a';c.beginPath();c.moveTo(x-7,y-44);c.lineTo(x-9,y-50);c.lineTo(x-3,y-46);c.closePath();c.fill();c.beginPath();c.moveTo(x+7,y-44);c.lineTo(x+9,y-50);c.lineTo(x+3,y-46);c.closePath();c.fill();c.fillStyle='#aaccff';c.fillRect(x-4,y-36,2,2);c.fillRect(x+2,y-36,2,2);}

startAnim('at-a',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBeowulf(c,w*0.3,h*0.7);
  if(t<0.5){const tt=t/0.5;const ang=-Math.PI/3+tt*Math.PI*0.7;
    for(let k=4;k>=0;k--){const a2=-Math.PI/3+(tt-k*0.04)*Math.PI*0.7;
      const x=w*0.3+12+Math.cos(a2)*45,y=h*0.65+Math.sin(a2)*45;
      c.strokeStyle=`rgba(221,232,240,${0.6-k*0.1})`;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(w*0.3+12,h*0.65);c.lineTo(x,y);c.stroke();}c.lineCap='butt';
    const x=w*0.3+12+Math.cos(ang)*45,y=h*0.65+Math.sin(ang)*45;
    c.save();c.translate(x,y);c.rotate(ang+Math.PI/2);c.fillStyle='#dde8f0';c.fillRect(-2,-15,4,30);c.restore();
  }else{c.fillStyle=`rgba(255,255,255,${1-(t-0.5)/0.5})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1400);

startAnim('at-b',(c,t,w,h)=>{const tg={x:w*0.65,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBeowulf(c,w*0.25,h*0.7);
  if(t<0.7){const tt=t/0.7;const x=w*0.25+13+tt*(tg.x-w*0.25-25);
    // 青雷の矢
    c.save();c.translate(x,h*0.6);c.rotate(0.1);c.strokeStyle='#88aaff';c.lineWidth=2.5;c.beginPath();c.moveTo(-12,0);c.lineTo(12,0);c.stroke();c.fillStyle='#88aaff';c.beginPath();c.moveTo(12,-4);c.lineTo(18,0);c.lineTo(12,4);c.closePath();c.fill();c.restore();
    // 雷の枝
    for(let k=1;k<4;k++){const tk=Math.max(0,tt-k*0.06);const xk=w*0.25+13+tk*(tg.x-w*0.25-25);
      c.strokeStyle=`rgba(136,170,255,${0.4-k*0.08})`;c.lineWidth=1.5;c.beginPath();c.moveTo(xk-6,h*0.6);c.lineTo(xk+6,h*0.6);c.stroke();}
  }else{c.fillStyle=`rgba(136,170,255,${1-(t-0.7)/0.3})`;c.beginPath();c.arc(tg.x,tg.y-16,20,0,Math.PI*2);c.fill();}
},1500);

startAnim('at-c',(c,t,w,h)=>{const tg={x:w*0.55,y:h*0.7};drawEnemy(c,tg.x,tg.y);drawBeowulf(c,w*0.3,h*0.7);
  const phase=t*2;const idx=Math.floor(phase);const sub=phase-idx;
  for(let k=0;k<2;k++){const a=-Math.PI/3+sub*Math.PI*0.7+k*Math.PI*0.4;
    c.strokeStyle=`rgba(255,210,74,${0.7-k*0.3})`;c.lineWidth=5;c.lineCap='round';
    c.beginPath();c.moveTo(w*0.3+12,h*0.65);c.lineTo(w*0.3+12+Math.cos(a)*45,h*0.65+Math.sin(a)*45);c.stroke();}c.lineCap='butt';
  if(sub<0.4){c.fillStyle=`rgba(255,255,200,${(1-sub*2.5)*0.7})`;c.beginPath();c.arc(tg.x,tg.y-16,16,0,Math.PI*2);c.fill();}
  c.fillStyle='#ffd24a';c.font='bold 18px sans-serif';c.textAlign='center';c.fillText((idx+1)+'HIT',tg.x,h*0.95);
},1300);
</script></body></html>
