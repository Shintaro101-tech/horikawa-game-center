<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<title>主人公デザインえらび</title>
<style>
  :root{--ink:#1f2d3d;}
  *{box-sizing:border-box;}
  body{margin:0;color:var(--ink);
    background:linear-gradient(180deg,#7ec8ff 0%,#bfe9ff 45%,#d9f5c9 100%);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;}
  ruby rt{font-size:.5em;opacity:.8;font-weight:normal;}
  header{text-align:center;padding:22px 16px 8px;}
  h1{font-size:clamp(1.7rem,6.5vw,2.6rem);margin:.1em 0;color:#fff;font-weight:900;
    -webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink),0 6px 8px rgba(0,0,0,.3);}
  .lead{font-weight:800;max-width:640px;margin:8px auto 0;line-height:1.6;font-size:clamp(.9rem,3.4vw,1.05rem);}
  .tag{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:4px 14px;font-weight:900;margin-top:6px;box-shadow:0 3px 0 rgba(31,45,61,.35);}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 60px;}
  .card{background:#fff;border:4px solid var(--ink);border-radius:22px;margin:18px 0;
    box-shadow:0 6px 0 rgba(31,45,61,.4);overflow:hidden;}
  .card h2{margin:0;padding:12px 16px;font-size:clamp(1.2rem,5vw,1.6rem);font-weight:900;
    background:linear-gradient(180deg,#bfe7ff,#1aa3ff);color:#fff;border-bottom:4px solid var(--ink);}
  .card h2 small{display:block;font-size:.6em;font-weight:800;opacity:.9;}
  .stage{width:100%;height:330px;display:block;background:transparent;}
  .caps{display:flex;border-top:4px solid var(--ink);}
  .cap{flex:1;padding:10px 8px;font-size:.84rem;font-weight:700;line-height:1.45;text-align:center;}
  .cap:not(:last-child){border-right:3px dashed rgba(31,45,61,.3);}
  .cap b{display:block;font-size:1.05rem;font-weight:900;margin-bottom:3px;}
  .cap.A b{color:#e8590c;} .cap.B b{color:#1971c2;} .cap.C b{color:#9b5cff;}
  footer{text-align:center;font-weight:800;padding:10px 16px 40px;opacity:.85;line-height:1.7;}
</style>
</head>
<body>
<header>
  <h1>🐣 <ruby>主人公<rt>しゅじんこう</rt></ruby>デザインえらび</h1>
  <p class="lead"><ruby>今<rt>いま</rt></ruby>と<ruby>同<rt>おな</rt></ruby>じ<ruby>色合<rt>いろあ</rt></ruby>い（<ruby>水色<rt>みずいろ</rt></ruby>）で <ruby>愛<rt>あい</rt></ruby>くるしい<ruby>案<rt>あん</rt></ruby>を3つ<ruby>用意<rt>ようい</rt></ruby>しました。<br>
  「<ruby>主人公<rt>しゅじんこう</rt></ruby>は<b>C</b>」のように<ruby>教<rt>おし</rt></ruby>えてください！</p>
  <span class="tag">くるくる<ruby>回<rt>まわ</rt></ruby>るよ</span>
</header>
<div class="wrap" id="wrap"></div>
<footer><ruby>色<rt>いろ</rt></ruby>や<ruby>細<rt>こま</rt></ruby>かい<ruby>部分<rt>ぶぶん</rt></ruby>は<ruby>本番<rt>ほんばん</rt></ruby>で<ruby>調整<rt>ちょうせい</rt></ruby>できます。<ruby>今<rt>いま</rt></ruby>は<ruby>丸<rt>まる</rt></ruby>いマスコットが<ruby>入<rt>はい</rt></ruby>っています。</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
function mat(c,o={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55},o));}
function cone(r,h,m,s){return new THREE.Mesh(new THREE.ConeGeometry(r,h,s||7),m);}
function eyes(g,pos,dx,r,col){ for(const sx of [-dx,dx]){
  const w=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),mat(0xffffff,{roughness:.3})); w.position.set(pos[0]+sx,pos[1],pos[2]); g.add(w);
  const p=new THREE.Mesh(new THREE.SphereGeometry(r*0.6,10,10),mat(col||0x223040)); p.position.set(pos[0]+sx,pos[1],pos[2]+r*0.66); g.add(p);
  const sh=new THREE.Mesh(new THREE.SphereGeometry(r*0.22,8,8),mat(0xffffff,{emissive:0xffffff,emissiveIntensity:.5})); sh.position.set(pos[0]+sx+r*0.18,pos[1]+r*0.25,pos[2]+r*0.8); g.add(sh);} }
const TEAL=0x4fd0c0, BLUE=0x2f8fe0, PINK=0xff9db0, WHITE=0xffffff;

// A: まんまるネコ
function catChar(){ const g=new THREE.Group(); const teal=mat(TEAL);
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.78,16,14),teal); body.scale.set(1,1.05,0.95); body.position.y=0.85; g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,10),mat(WHITE)); belly.position.set(0,0.72,0.45); belly.scale.set(1,1.1,0.5); g.add(belly);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.6,16,14),teal); head.position.y=1.62; g.add(head);
  for(const sx of [-1,1]){ const ear=cone(0.22,0.42,teal,4); ear.position.set(sx*0.4,2.12,0); ear.rotation.y=Math.PI/4; g.add(ear);
    const ie=cone(0.12,0.24,mat(PINK),4); ie.position.set(sx*0.4,2.1,0.05); ie.rotation.y=Math.PI/4; g.add(ie); }
  eyes(g,[0,1.66,0.5],0.22,0.16);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),mat(0xff7a9a)); nose.position.set(0,1.48,0.6); g.add(nose);
  for(const sx of [-1,1]) for(let k=-1;k<=1;k++){ const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,0.42,4),mat(WHITE)); wh.position.set(sx*0.46,1.48+k*0.08,0.48); wh.rotation.z=Math.PI/2; wh.rotation.y=sx*0.3; g.add(wh); }
  for(const sx of [-1,1]){ const c=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),mat(PINK)); c.position.set(sx*0.34,1.5,0.46); g.add(c); }
  for(const sx of [-0.58,0.58]){ const paw=new THREE.Mesh(new THREE.SphereGeometry(0.16,9,8),teal); paw.position.set(sx,0.95,0.12); g.add(paw); }
  for(const sx of [-0.28,0.28]){ const foot=new THREE.Mesh(new THREE.SphereGeometry(0.18,9,8),mat(BLUE)); foot.position.set(sx,0.18,0.12); foot.scale.set(1,0.7,1.25); g.add(foot); }
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,0.75,8),teal); tail.position.set(0.55,0.95,-0.45); tail.rotation.z=-0.9; g.add(tail);
  return g;
}
// B: ぷくぷくペンギン
function penguinChar(){ const g=new THREE.Group(); const teal=mat(TEAL);
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.8,16,14),teal); body.scale.set(1,1.2,0.95); body.position.y=0.98; g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.62,14,12),mat(WHITE)); belly.position.set(0,0.92,0.42); belly.scale.set(0.82,1.15,0.6); g.add(belly);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.56,16,14),teal); head.position.y=1.78; g.add(head);
  const face=new THREE.Mesh(new THREE.SphereGeometry(0.46,12,10),mat(WHITE)); face.position.set(0,1.74,0.28); face.scale.set(0.92,1,0.5); g.add(face);
  eyes(g,[0,1.85,0.46],0.17,0.14);
  const beak=cone(0.14,0.32,mat(0xffa53b),6); beak.position.set(0,1.66,0.62); beak.rotation.x=Math.PI/2; g.add(beak);
  for(const sx of [-1,1]){ const fl=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,8),mat(BLUE)); fl.position.set(sx*0.82,0.98,0); fl.scale.set(0.4,1.15,0.7); fl.rotation.z=sx*0.35; g.add(fl); }
  for(const sx of [-0.25,0.25]){ const foot=new THREE.Mesh(new THREE.SphereGeometry(0.19,9,8),mat(0xffa53b)); foot.position.set(sx,0.12,0.16); foot.scale.set(1,0.5,1.4); g.add(foot); }
  for(const sx of [-1,1]){ const c=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),mat(PINK)); c.position.set(sx*0.33,1.7,0.42); g.add(c); }
  return g;
}
// C: ふわふわウサギ
function bunnyChar(){ const g=new THREE.Group(); const teal=mat(TEAL);
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.75,16,14),teal); body.scale.set(1,1.05,0.95); body.position.y=0.82; g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.48,12,10),mat(WHITE)); belly.position.set(0,0.7,0.44); belly.scale.set(1,1.1,0.5); g.add(belly);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.58,16,14),teal); head.position.y=1.58; g.add(head);
  for(const sx of [-1,1]){ const ear=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,12),teal); ear.scale.set(0.55,2.1,0.5); ear.position.set(sx*0.26,2.42,-0.04); ear.rotation.z=sx*0.12; g.add(ear);
    const ie=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,10),mat(PINK)); ie.scale.set(0.5,1.9,0.3); ie.position.set(sx*0.26,2.42,0.06); ie.rotation.z=sx*0.12; g.add(ie); }
  eyes(g,[0,1.6,0.48],0.2,0.16);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),mat(0xff7a9a)); nose.position.set(0,1.44,0.56); g.add(nose);
  for(const sx of [-1,1]){ const c=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),mat(PINK)); c.position.set(sx*0.32,1.47,0.45); g.add(c); }
  for(const sx of [-0.55,0.55]){ const paw=new THREE.Mesh(new THREE.SphereGeometry(0.15,9,8),teal); paw.position.set(sx,0.9,0.12); g.add(paw); }
  for(const sx of [-0.26,0.26]){ const foot=new THREE.Mesh(new THREE.SphereGeometry(0.18,9,8),mat(BLUE)); foot.position.set(sx,0.16,0.16); foot.scale.set(1,0.7,1.45); g.add(foot); }
  const tail=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,10),mat(WHITE)); tail.position.set(0,0.7,-0.72); g.add(tail);
  return g;
}

const DEF={ name:'🐣 <ruby>主人公<rt>しゅじんこう</rt></ruby>（あなた）', sub:'<ruby>水色<rt>みずいろ</rt></ruby>の<ruby>愛<rt>あい</rt></ruby>くるしいマスコット',
  caps:['<b>A</b>まんまるネコ<br><ruby>三角<rt>さんかく</rt></ruby><ruby>耳<rt>みみ</rt></ruby>＋しっぽ＋ヒゲの こねこ',
        '<b>B</b>ぷくぷくペンギン<br><ruby>白<rt>しろ</rt></ruby>いおなか＋くちばしの ひな',
        '<b>C</b>ふわふわウサギ<br><ruby>長<rt>なが</rt></ruby>い<ruby>耳<rt>みみ</rt></ruby>＋まるいしっぽの うさぎ'],
  builds:[catChar,penguinChar,bunnyChar] };

const renderers=[];
function buildSection(def){
  const card=document.createElement('div'); card.className='card';
  const h2=document.createElement('h2'); h2.innerHTML=def.name+'<small>'+def.sub+'</small>'; card.appendChild(h2);
  const canvas=document.createElement('canvas'); canvas.className='stage'; card.appendChild(canvas);
  const caps=document.createElement('div'); caps.className='caps';
  ['A','B','C'].forEach((L,i)=>{ const c=document.createElement('div'); c.className='cap '+L; c.innerHTML=def.caps[i]; caps.appendChild(c);});
  card.appendChild(caps); document.getElementById('wrap').appendChild(card);
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff,0x8fbf6f,1.2));
  const sun=new THREE.DirectionalLight(0xfff3d6,0.9); sun.position.set(6,12,8); scene.add(sun);
  const camera=new THREE.PerspectiveCamera(42,2,0.1,100);
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const variants=[];
  for(let i=0;i<3;i++){
    const wrap=new THREE.Group(); const model=def.builds[i]();
    const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3());
    const maxd=Math.max(size.x,size.y,size.z)||1; model.scale.setScalar(3.0/maxd);
    const c2=new THREE.Box3().setFromObject(model), ctr=c2.getCenter(new THREE.Vector3()); model.position.sub(ctr);
    wrap.add(model); wrap.position.x=(i-1)*4.3;
    const disc=new THREE.Mesh(new THREE.CircleGeometry(1.5,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.12}));
    disc.rotation.x=-Math.PI/2; disc.position.y=-1.7; wrap.add(disc);
    scene.add(wrap); variants.push(wrap);
  }
  renderers.push({renderer,scene,camera,variants,canvas});
}
buildSection(DEF);
function resize(){ renderers.forEach(r=>{ const w=r.canvas.clientWidth,h=r.canvas.clientHeight;
  r.renderer.setSize(w,h,false); r.camera.aspect=w/h; r.camera.updateProjectionMatrix();
  r.camera.position.set(0,0.6,13); r.camera.lookAt(0,0,0); }); }
addEventListener('resize',resize); resize();
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  renderers.forEach(r=>{ r.variants.forEach(v=>v.rotation.y+=dt*0.7); r.renderer.render(r.scene,r.camera); });
  requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
